<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1730"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Calories"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg"><title>Calorie Tracker</title><style>
:root{--ink:#101a2d;--muted:#718097;--navy:#0b1730;--navy2:#162d55;--blue:#3d7cff;--cyan:#54d6ff;--green:#20c77a;--red:#ff5d69;--gold:#ffca5c;--bg:#f3f6fb;--card:#fff;--line:#e4e9f2;--shadow:0 12px 35px rgba(16,32,60,.08)}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;padding-bottom:92px}.wrap{max-width:780px;margin:auto}.top{background:linear-gradient(145deg,#071126 0%,#102b55 58%,#1b4c84 100%);color:#fff;padding:17px 17px 21px;position:sticky;top:0;z-index:10;box-shadow:0 8px 30px rgba(7,17,38,.2)}.top h1{margin:0;font-size:24px;letter-spacing:-.5px}.top p{margin:5px 0 0;color:#b9c8df;font-size:12px}.main{padding:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}.hero{position:relative;overflow:hidden;color:#fff;border:0;background:radial-gradient(circle at 90% 10%,#356fb0 0,transparent 35%),linear-gradient(145deg,#08152f,#12345f 62%,#1b5287)}.hero:after{content:"";position:absolute;width:170px;height:170px;border:1px solid rgba(255,255,255,.09);border-radius:50%;right:-75px;bottom:-95px}.hero .label,.hero .muted{color:#b9cbe3}.hero .stat{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.1);color:#fff}.hero .stat .label{color:#b9cbe3}.balance{font-size:43px;line-height:1;font-weight:850;letter-spacing:-1.8px;margin:7px 0}.balance.deficit{color:#5df0aa}.balance.surplus{color:#ff7882}.balance.zero{color:#fff}.balanceCaption{font-size:13px;font-weight:650}.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:750}.muted{font-size:12px;color:var(--muted)}.title{font-size:17px;font-weight:800;letter-spacing:-.2px;margin:0 0 12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat{background:#f7f9fc;border:1px solid var(--line);border-radius:15px;padding:12px}.stat b{display:block;font-size:18px;margin-top:5px;letter-spacing:-.3px}.hero .stat b{font-size:17px}.btn{border:0;border-radius:13px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:750;box-shadow:0 5px 14px rgba(61,124,255,.2)}.btn:active{transform:scale(.98)}.btn.sec{background:#edf3ff;color:#2453a5;box-shadow:none}.btn.danger{background:#fff0f2;color:#d93e4c;box-shadow:none}.btn.dark{background:#122746}.btn.sm{padding:8px 10px;font-size:12px}.input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-size:15px;outline:none}.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #3d7cff15}.field{margin-bottom:10px}.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:750;margin-bottom:5px}.bar{height:13px;background:#e9edf4;border-radius:99px;overflow:hidden}.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#3674ff,#5cbbff)}.fill.green{background:linear-gradient(90deg,#17b86d,#55e2a0)}.fill.red{background:linear-gradient(90deg,#ff5b68,#ff8a83)}.food{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.food:last-child{border-bottom:0}.foodName{font-weight:750}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.chip{background:#f0f3f8;border-radius:99px;padding:4px 8px;font-size:10px;color:#65738a;font-weight:650}.pos{color:var(--green)}.neg{color:var(--red)}.empty{text-align:center;padding:25px 10px;color:var(--muted);font-size:13px}.notice{background:#eef5ff;border:1px solid #d8e6ff;color:#28558e;border-radius:13px;padding:11px;font-size:12px}.bigNumber{font-size:30px;font-weight:850;letter-spacing:-1px}.metricIcon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#eef4ff;font-size:19px}.sectionHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.sectionHead .title{margin:0}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calh{text-align:center;color:var(--muted);font-size:10px;font-weight:750;padding:5px}.day{min-height:58px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:6px;font-size:10px;text-align:left}.day strong{display:block;font-size:13px}.day.def{background:#ecfbf4;border-color:#b9ead1}.day.sur{background:#fff0f2;border-color:#f4c3c9}.day.today{outline:2px solid var(--blue);outline-offset:1px}.chart{height:245px;position:relative}.chart canvas{width:100%;height:100%}.forecastDate{font-size:28px;font-weight:850;letter-spacing:-1px}.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:30;padding:7px 4px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(6,1fr);box-shadow:0 -8px 25px rgba(16,32,60,.07)}.nav button{border:0;background:none;color:#8290a4;font-size:9px;font-weight:650;padding:2px}.nav button.active{color:var(--blue)}.nav i{font-style:normal;font-size:20px;display:block;margin-bottom:2px}.modal{position:fixed;inset:0;background:rgba(3,10,24,.65);display:none;align-items:flex-end;z-index:50}.modal.show{display:flex}.sheet{width:100%;max-width:780px;margin:auto;background:#fff;border-radius:25px 25px 0 0;padding:18px;max-height:92vh;overflow:auto;box-shadow:0 -20px 60px rgba(0,0,0,.2)}.sheetTitle{font-size:20px;font-weight:850}.divider{height:1px;background:var(--line);margin:12px 0}.switchNote{font-size:11px;color:var(--muted)}.heroProgress{font-size:12px;color:#c9d8ec}.pill{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border-radius:99px;background:#ffffff12;color:#dce9f8;font-size:11px}.ring{width:116px;height:116px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) var(--p),rgba(255,255,255,.1) 0);position:relative}.ring:after{content:"";position:absolute;inset:9px;border-radius:50%;background:#102c55}.ringText{position:relative;z-index:1;text-align:center}.ringText b{display:block;font-size:24px}.ringText span{font-size:9px;color:#bed0e6}.resultRow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.1)}.resultRow:last-child{border:0}@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:25px}.nav{left:50%;right:auto;transform:translateX(-50%);width:780px}}
</style></head><body><header class="top"><div class="wrap"><h1 id="head">Daily</h1><p id="sub"></p></div></header><main class="wrap main" id="app"></main><nav class="nav"><button data-p="daily"><i>⌂</i>Daily</button><button data-p="progress"><i>◉</i>Progress</button><button data-p="calendar"><i>▦</i>Calendar</button><button data-p="charts"><i>⌁</i>Charts</button><button data-p="prediction"><i>◈</i>Predict</button><button data-p="settings"><i>⚙</i>Settings</button></nav><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><script>
const KEY='calorieTracker_v3',TOD=()=>new Date().toISOString().slice(0,10),DEF={settings:{maintenance:2200,startWeight:70,goalWeight:65,targetDeficit:38500,calPerKg:7700},days:{}};let S=load(),P='daily',D=TOD();function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.settings&&x.days)return x;let old=JSON.parse(localStorage.getItem('calorieTracker_v2')||'null');return old&&old.settings&&old.days?old:structuredClone(DEF)}catch{return structuredClone(DEF)}}function save(){localStorage.setItem(KEY,JSON.stringify(S))}function day(d=D){if(!S.days[d])S.days[d]={maintenance:S.settings.maintenance,foods:[],burns:[]};let x=S.days[d];x.foods=x.foods||[];x.burns=x.burns||[];return x}function N(v){return Number(v)||0}function F(v){return Math.round(v).toLocaleString('en-IN')}function E(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function T(d){let x=day(d),a=x.foods.reduce((z,f)=>({cal:z.cal+N(f.cal),p:z.p+N(f.p),c:z.c+N(f.c),f:z.f+N(f.f)}),{cal:0,p:0,c:0,f:0}),b=x.burns.reduce((z,f)=>z+N(f.cal),0);let balance=a.cal? a.cal-N(x.maintenance)-b : 0;return {...a,b,maintenance:N(x.maintenance),balance}}function DS(){return Object.keys(S.days).filter(d=>S.days[d].foods?.length||S.days[d].burns?.length||S.days[d].weight!=null).sort()}function CUM(){return DS().reduce((z,d)=>z+T(d).balance,0)}function AVG(){let d=DS();return d.length?CUM()/d.length:0}function pct(a,b){return b?Math.max(0,Math.min(100,a/b*100)):0}function render(){let names={daily:'Daily',progress:'Progress Card',calendar:'Calorie Calendar',charts:'Progress Charts',prediction:'Prediction',settings:'Settings'};head.textContent=names[P];sub.textContent=P==='daily'?new Date(D+'T12:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'Private • stored on this device';document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('active',x.dataset.p===P));app.innerHTML={daily,progress,calendar,charts,prediction,settings}[P]();bind();if(P==='charts')setTimeout(drawCharts,40)}
function daily(){let x=day(),t=T(D),w=x.weight,hasFood=x.foods.length>0,cls=!hasFood?'zero':t.balance<0?'deficit':'surplus';return `<div class="card hero"><div class=row><div><span class=label>${D===TOD()?'TODAY':'SELECTED DAY'}</span><div class="balance ${cls}">${hasFood?(t.balance<0?'−':'+' )+F(Math.abs(t.balance)):'0'}</div><div class=balanceCaption>${!hasFood?'Start logging to calculate your balance':t.balance<0?'CALORIE DEFICIT':'CALORIE SURPLUS'}</div></div><input id=date class=input type=date value=${D} style="width:145px"></div><div class=g3 style="margin-top:18px"><div class=stat><span class=label>Food</span><b>${F(t.cal)} kcal</b></div><div class=stat><span class=label>Maintenance</span><b>${F(t.maintenance)} kcal</b></div><div class=stat><span class=label>Extra burn</span><b>${F(t.b)} kcal</b></div></div></div><div class=card><div class=sectionHead><div class=title>Today's macros</div><span class=muted>${x.foods.length} entries</span></div><div class=g3><div class=stat><span class=label>Protein</span><b>${F(t.p)}g</b></div><div class=stat><span class=label>Carbs</span><b>${F(t.c)}g</b></div><div class=stat><span class=label>Fat</span><b>${F(t.f)}g</b></div></div></div><div class=card><div class=sectionHead><div class=title>Food log</div><button class="btn sm" id=addFood>＋ Add food</button></div>${x.foods.length?x.foods.map((f,i)=>`<div class=food><div><div class=foodName>${E(f.name)}</div><div class=muted>${E(f.qty)} · ${F(f.cal)} kcal</div><div class=chips><span class=chip>Protein ${F(f.p)}g</span><span class=chip>Carbs ${F(f.c)}g</span><span class=chip>Fat ${F(f.f)}g</span></div></div><div><button class="btn sec sm" onclick="editFood(${i})">Edit</button></div></div>`).join(''):'<div class=empty><b>No food yet</b><br>Add your first food to start calculating today's balance.</div>'}</div><div class=card><div class=sectionHead><div class=title>Extra calories burned</div><button class="btn sm" id=addBurn>＋ Add burn</button></div>${x.burns.length?x.burns.map((b,i)=>`<div class=food><div><div class=foodName>${E(b.name)}</div><span class=muted>${F(b.cal)} kcal burned</span></div><div><button class="btn sec sm" onclick="editBurn(${i})">Edit</button></div></div>`).join(''):'<div class=empty>Walking, gym, cycling or any other manually added activity.</div>'}</div><div class=card><div class=sectionHead><div class=title>Day settings</div><span class=pill style="background:#eef5ff;color:#28558e">Only ${D}</span></div><div class=g2><div class=field><label>Maintenance kcal</label><input id=dayMaint class=input type=number value=${t.maintenance}></div><div class=field><label>Morning weight kg</label><input id=dayWeight class=input type=number step=.1 value="${w??''}"></div></div><button id=saveDay class="btn dark" style="width:100%">Save this day</button><div class=notice style="margin-top:10px">Changing maintenance here changes <b>only ${D}</b>. Previous days keep their own saved maintenance.</div></div>`}
function progress(){let s=S.settings,c=CUM(),w=s.startWeight-c/s.calPerKg,loss=s.startWeight-s.goalWeight,wp=loss?Math.max(0,Math.min(100,(s.startWeight-w)/loss*100)):0,tp=pct(Math.max(0,c),s.targetDeficit);return `<div class="card hero"><div class=row><div><span class=label>YOUR RESULT</span><div class=balance ${c>=0?'surplus':'deficit'}>${c<0?'−':'+'}${F(Math.abs(c))}</div><div class=balanceCaption>${c<0?'Net deficit accumulated':'Net surplus accumulated'}</div><div class=heroProgress style="margin-top:6px">${F(Math.abs(s.targetDeficit-Math.abs(c)))} kcal ${c<0?'left to target':'target reference'}</div></div><div class=ring style="--p:${tp}%"><div class=ringText><b>${tp.toFixed(0)}%</b><span>TARGET</span></div></div></div></div><div class=card><div class=sectionHead><div class=title>Weight transformation</div><span class=pill style="background:#ecfbf4;color:#168454">${wp.toFixed(0)}% journey</span></div><div class=g2><div class=stat><span class=label>Starting</span><b>${s.startWeight.toFixed(1)} kg</b></div><div class=stat><span class=label>Goal</span><b>${s.goalWeight.toFixed(1)} kg</b></div><div class=stat><span class=label>Theoretical now</span><b>${w.toFixed(1)} kg</b></div><div class=stat><span class=label>Avg daily deficit</span><b>${F(Math.max(0,-AVG()))} kcal</b></div></div><div style="margin-top:14px"><div class=row><span class=muted>Progress to goal</span><b>${wp.toFixed(1)}%</b></div><div class=bar><div class="fill green" style="width:${wp}%"></div></div></div></div><div class=card><div class=sectionHead><div class=title>Goal numbers</div><span class=muted>${F(s.calPerKg)} kcal = 1 kg</span></div><div class=g3><div class=stat><span class=label>Target deficit</span><b>${F(s.targetDeficit)}</b></div><div class=stat><span class=label>Tracked days</span><b>${DS().length}</b></div><div class=stat><span class=label>Remaining</span><b>${F(Math.max(0,s.targetDeficit-Math.max(0,-c)))}</b></div></div></div><div class=card><div class=title>Recent weight</div>${weightLogs()}</div>`}
function weightLogs(){let a=Object.keys(S.days).filter(d=>S.days[d].weight!=null).sort().slice(-8).reverse();return a.length?a.map(d=>`<div class=food><span>${new Date(d+'T12:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}</span><b>${N(S.days[d].weight).toFixed(1)} kg</b></div>`).join(''):'<div class=empty>Log your morning weight from the Daily tab.</div>'}
function calendar(){let q=new Date(D+'T12:00'),y=q.getFullYear(),m=q.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),c=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class=calh>${x}</div>`).join('');for(let i=0;i<first;i++)c+='<div></div>';for(let i=1;i<=n;i++){let d=`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`,t=S.days[d]&&S.days[d].foods?.length?T(d):null;c+=`<button class="day ${d===TOD()?'today ':''}${t?(t.balance<0?'def':'sur'):''}" onclick="openDay('${d}')"><strong>${i}</strong>${t?`<span class=${t.balance<0?'pos':'neg'}>${t.balance<0?'−':'+'}${F(Math.abs(t.balance))}</span>`:''}</button>`}return `<div class=card><div class=sectionHead><button class="btn sec sm" onclick="changeMonth(-1)">‹</button><div class=title>${q.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</div><button class="btn sec sm" onclick="changeMonth(1)">›</button></div><div class=calendar>${c}</div><p class=muted>Green = deficit · Red = surplus · Tap a recorded day for the full report.</p></div>`}
function charts(){return `<div class=card><div class=sectionHead><div class=title>Cumulative deficit</div><span class=muted>Target ${F(S.settings.targetDeficit)} kcal</span></div><div class=chart><canvas id=defChart></canvas></div></div><div class=card><div class=sectionHead><div class=title>Theoretical weight</div><span class=muted>${S.settings.startWeight} → ${S.settings.goalWeight} kg</span></div><div class=chart><canvas id=weightChart></canvas></div></div>`}
function prediction(){let s=S.settings,def=Math.max(0,-CUM()),r=Math.max(0,s.targetDeficit-def),a=Math.max(0,-AVG()),days=a>0?r/a:null,g=days?new Date(Date.now()+days*86400000):null;return `<div class="card hero"><span class=label>THE ROAD AHEAD</span><div class=title style="font-size:24px;margin-top:5px">Your forecast</div><div class=g2 style="margin-top:15px"><div class=stat><span class=label>Remaining deficit</span><b>${F(r)} kcal</b></div><div class=stat><span class=label>Average daily deficit</span><b>${F(a)} kcal</b></div><div class=stat><span class=label>Estimated days</span><b>${days?Math.ceil(days):'—'}</b></div><div class=stat><span class=label>Goal date</span><b>${g?g.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'—'}</b></div></div></div><div class=card><div class=title>How this is calculated</div><div class=food><span>Target deficit</span><b>${F(s.targetDeficit)} kcal</b></div><div class=food><span>Already accumulated</span><b>${F(def)} kcal</b></div><div class=food><span>Still needed</span><b>${F(r)} kcal</b></div><div class=food><span>Current average</span><b>${F(a)} kcal/day</b></div>${a?`<div class=notice style="margin-top:12px">At your current average, the target is approximately <b>${Math.ceil(days)} days</b> away. This is a mathematical estimate, not a promise of scale-weight timing.</div>`:'<div class=notice style="margin-top:12px">Add a few deficit days and this forecast will start calculating automatically.</div>'}</div>`}
function settings(){let s=S.settings;return `<div class=card><div class=sectionHead><div class=title>Goal settings</div><span class=pill style="background:#eef5ff;color:#28558e">Local only</span></div><div class=g2><div class=field><label>Default maintenance kcal</label><input id=sm class=input type=number value=${s.maintenance}></div><div class=field><label>Starting weight kg</label><input id=sw class=input type=number step=.1 value=${s.startWeight}></div><div class=field><label>Goal weight kg</label><input id=gw class=input type=number step=.1 value=${s.goalWeight}></div><div class=field><label>Target deficit kcal</label><input id=td class=input type=number value=${s.targetDeficit}></div><div class=field><label>Calories per kg</label><input id=ck class=input type=number value=${s.calPerKg}></div></div><button class=btn id=saveSettings style="width:100%">Save settings</button><div class=notice style="margin-top:10px">Default maintenance is used only when a new day is created. It never overwrites previous days.</div></div><div class=card><div class=title>Backup & restore</div><p class=muted>Export everything as a JSON backup. Restore it later on this iPhone or another browser.</p><div class=g2><button class=btn id=exportBtn>Export backup</button><label class="btn sec" style="text-align:center"><input id=importFile type=file accept=application/json hidden>Import backup</label></div></div><div class=card><div class=title>Privacy</div><p class=muted>Your tracker runs in the browser. No login, AI, analytics, database or external API is required.</p><button class="btn danger" id=clearBtn style="width:100%">Clear all data</button></div>`}
function bind(){document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{P=b.dataset.p;render()});let date=document.getElementById('date');if(date)date.onchange=e=>{D=e.target.value;render()};let af=document.getElementById('addFood');if(af)af.onclick=()=>foodForm(null);let ab=document.getElementById('addBurn');if(ab)ab.onclick=()=>burnForm(null);let sd=document.getElementById('saveDay');if(sd)sd.onclick=()=>{let x=day();x.maintenance=N(dayMaint.value);if(dayWeight.value==='')delete x.weight;else x.weight=N(dayWeight.value);save();render()};let ss=document.getElementById('saveSettings');if(ss)ss.onclick=()=>{S.settings={maintenance:N(sm.value),startWeight:N(sw.value),goalWeight:N(gw.value),targetDeficit:N(td.value),calPerKg:N(ck.value)};save();render()};let ex=document.getElementById('exportBtn');if(ex)ex.onclick=exportData;let im=document.getElementById('importFile');if(im)im.onchange=importData;let cl=document.getElementById('clearBtn');if(cl)cl.onclick=()=>{if(confirm('Delete all tracker data?')){S=structuredClone(DEF);save();render()}}}
function openModal(h){sheet.innerHTML=h;modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}modal.onclick=e=>{if(e.target===modal)closeModal()}
function foodForm(i){let f=i==null?{name:'',qty:'',cal:'',p:'',c:'',f:''}:day().foods[i];openModal(`<div class=row><div><div class=label>FOOD LOG</div><div class=sheetTitle>${i==null?'Add food':'Edit food'}</div></div><button class="btn sec sm" onclick=closeModal()>Close</button></div><div class=divider></div><div class=field><label>Food name</label><input id=fn class=input value="${E(f.name)}" placeholder="Chicken breast"></div><div class=field><label>Quantity</label><input id=fq class=input value="${E(f.qty)}" placeholder="150 g"></div><div class=g2><div class=field><label>Calories</label><input id=fc class=input type=number value=${f.cal}></div><div class=field><label>Protein g</label><input id=fp class=input type=number step=.1 value=${f.p}></div><div class=field><label>Carbs g</label><input id=fb class=input type=number step=.1 value=${f.c}></div><div class=field><label>Fat g</label><input id=ff class=input type=number step=.1 value=${f.f}></div></div><button class=btn style="width:100%" onclick="saveFood(${i==null?-1:i})">${i==null?'Add food':'Save changes'}</button>`)}function editFood(i){foodForm(i)}function saveFood(i){let f={name:fn.value||'Food',qty:fq.value,cal:N(fc.value),p:N(fp.value),c:N(fb.value),f:N(ff.value)};if(i<0)day().foods.push(f);else day().foods[i]=f;save();closeModal();render()}function removeFood(i){day().foods.splice(i,1);save();render()}
function burnForm(i){let b=i==null?{name:'',cal:''}:day().burns[i];openModal(`<div class=row><div><div class=label>ACTIVITY</div><div class=sheetTitle>${i==null?'Add calories burned':'Edit activity'}</div></div><button class="btn sec sm" onclick=closeModal()>Close</button></div><div class=divider></div><div class=field><label>Activity</label><input id=bn class=input value="${E(b.name)}" placeholder="Walking, gym, cycling"></div><div class=field><label>Calories burned</label><input id=bc class=input type=number value=${b.cal}></div><button class=btn style="width:100%" onclick="saveBurn(${i==null?-1:i})">${i==null?'Add burn':'Save changes'}</button>`)}function editBurn(i){burnForm(i)}function saveBurn(i){let b={name:bn.value||'Activity',cal:N(bc.value)};if(i<0)day().burns.push(b);else day().burns[i]=b;save();closeModal();render()}function removeBurn(i){day().burns.splice(i,1);save();render()}
function openDay(d){let x=day(d),t=T(d),has=x.foods.length>0;openModal(`<div class=row><div><div class=label>DAY REPORT</div><div class=sheetTitle>${new Date(d+'T12:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}</div><span class=muted>${d}</span></div><button class="btn sec sm" onclick=closeModal()>Close</button></div><div class=divider></div><div class="card hero" style="margin-bottom:10px"><span class=label>BALANCE</span><div class=balance ${!has?'zero':t.balance<0?'deficit':'surplus'}>${has?(t.balance<0?'−':'+')+F(Math.abs(t.balance)):'0'}</div><div class=balanceCaption>${!has?'No food logged':t.balance<0?'CALORIE DEFICIT':'CALORIE SURPLUS'}</div></div><div class=g2><div class=stat><span class=label>Food</span><b>${F(t.cal)}</b></div><div class=stat><span class=label>Maintenance</span><b>${F(t.maintenance)}</b></div><div class=stat><span class=label>Extra burn</span><b>${F(t.b)}</b></div><div class=stat><span class=label>Protein</span><b>${F(t.p)}g</b></div></div><div class=card style="margin-top:10px"><div class=title>Food & macros</div>${x.foods.length?x.foods.map(f=>`<div class=food><div><div class=foodName>${E(f.name)}</div><span class=muted>${E(f.qty)} · ${F(f.cal)} kcal</span></div><div class=chips><span class=chip>P ${F(f.p)}g</span><span class=chip>C ${F(f.c)}g</span><span class=chip>F ${F(f.f)}g</span></div></div>`).join(''):'<div class=empty>No food recorded.</div>'}</div>${x.weight!=null?`<div class=notice>Morning weight: <b>${N(x.weight).toFixed(1)} kg</b></div>`:''}`)}
function changeMonth(v){let q=new Date(D+'T12:00');q.setMonth(q.getMonth()+v);D=`${q.getFullYear()}-${String(q.getMonth()+1).padStart(2,'0')}-01`;render()}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='calorie-tracker-backup-'+TOD()+'.json';a.click()}
function importData(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.settings||!x.days)throw 0;S=x;save();render();alert('Backup restored.')}catch{alert('Invalid backup file.')}};r.readAsText(file)}
function drawCharts(){let ds=DS(),c=0,def=[0],weights=[S.settings.startWeight];ds.forEach(d=>{c+=T(d).balance;def.push(Math.max(0,-c));weights.push(S.settings.startWeight+c/S.settings.calPerKg)});drawLine(defChart,def,S.settings.targetDeficit);drawLine(weightChart,weights,S.settings.goalWeight)}function drawLine(c,a,target){let ctx=c.getContext('2d'),W=c.clientWidth,H=c.clientHeight,d=devicePixelRatio||1;c.width=W*d;c.height=H*d;ctx.scale(d,d);let mn=Math.min(...a,target),mx=Math.max(...a,target);if(mn===mx){mn--;mx++}let X=i=>38+(W-52)*(i/(a.length-1||1)),Y=v=>18+(H-45)*(mx-v)/(mx-mn);ctx.strokeStyle='#e2e7ef';ctx.lineWidth=1;for(let i=0;i<5;i++){let y=18+i*(H-45)/4;ctx.beginPath();ctx.moveTo(38,y);ctx.lineTo(W-14,y);ctx.stroke()}ctx.strokeStyle='#3d7cff';ctx.lineWidth=3;ctx.beginPath();a.forEach((v,i)=>i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v)));ctx.stroke();ctx.fillStyle='#718097';ctx.font='11px system-ui';ctx.fillText(Math.round(mx).toLocaleString(),4,22);ctx.fillText(Math.round(mn).toLocaleString(),4,H-25);ctx.fillText('Goal '+Math.round(target).toLocaleString(),W-88,12)}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});render();</script></body></html>
