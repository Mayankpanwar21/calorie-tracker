<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b67"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Calories"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg"><title>Calorie Tracker</title><style>:root{--n:#173b67;--b:#2d6cdf;--g:#159c61;--r:#d64b4b;--bg:#f5f7fb;--card:#fff;--t:#172033;--m:#687386;--l:#e1e6ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;padding-bottom:82px}.wrap{max-width:760px;margin:auto}.top{background:var(--n);color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}.top h1{margin:0;font-size:23px}.top p{margin:4px 0 0;font-size:13px;opacity:.78}.main{padding:15px}.card{background:var(--card);border:1px solid var(--l);border-radius:18px;padding:15px;margin-bottom:13px;box-shadow:0 3px 14px #173b6708}.hero{background:linear-gradient(135deg,#173b67,#2d5e95);color:#fff;border:0}.hero .muted,.hero .label{color:#d8e3f0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f7f9fc;border:1px solid var(--l);border-radius:13px;padding:11px}.stat b{display:block;font-size:19px;margin-top:4px}.label,.muted{font-size:12px;color:var(--m)}.big{font-size:32px;font-weight:800;margin:4px 0}.title{font-size:17px;font-weight:750;margin:2px 0 11px}.btn{border:0;border-radius:11px;padding:10px 13px;background:var(--b);color:#fff;font-weight:700}.btn.sec{background:#edf3fb;color:var(--n)}.btn.danger{background:#fff0f0;color:var(--r)}.btn.sm{padding:7px 9px;font-size:12px}.input{width:100%;padding:10px;border:1px solid var(--l);border-radius:10px;background:#fff;color:var(--t)}.field{margin-bottom:10px}.field label{display:block;font-size:12px;color:var(--m);margin-bottom:4px}.bar{height:11px;background:#e9edf3;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--b);border-radius:99px}.fill.g{background:var(--g)}.food{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid var(--l)}.food:last-child{border-bottom:0}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}.chip{background:#f0f3f7;border-radius:99px;padding:4px 7px;font-size:11px;color:var(--m)}.pos{color:var(--g)}.neg{color:var(--r)}.notice{background:#eef5ff;color:#294f7b;border-radius:11px;padding:10px;font-size:12px}.empty{text-align:center;padding:24px;color:var(--m)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calh{text-align:center;color:var(--m);font-size:10px;padding:4px}.day{min-height:53px;border:1px solid var(--l);border-radius:10px;background:#fff;padding:5px;font-size:10px}.day strong{display:block;font-size:13px}.day.def{background:#effaf4;border-color:#bde5cf}.day.sur{background:#fff3f3;border-color:#efc1c1}.day.today{outline:2px solid var(--b)}.chart{height:230px}.modal{position:fixed;inset:0;background:#07162b88;display:none;align-items:flex-end;z-index:30}.modal.show{display:flex}.sheet{width:100%;max-width:760px;margin:auto;background:#fff;border-radius:20px 20px 0 0;padding:17px;max-height:90vh;overflow:auto}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--l);z-index:20;display:grid;grid-template-columns:repeat(6,1fr);padding:5px 3px calc(5px + env(safe-area-inset-bottom))}.nav button{border:0;background:none;color:#788396;font-size:10px}.nav button.active{color:var(--n);font-weight:800}.nav i{font-style:normal;font-size:18px;display:block}.mini{font-size:11px;color:var(--m)}@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:20px}}</style></head><body><header class="top"><div class="wrap"><h1 id="head">Daily</h1><p id="sub"></p></div></header><main class="wrap main" id="app"></main><nav class="nav"><button data-p="daily"><i>🏠</i>Daily</button><button data-p="progress"><i>🎯</i>Progress</button><button data-p="calendar"><i>🗓️</i>Calendar</button><button data-p="charts"><i>📈</i>Charts</button><button data-p="prediction"><i>🔮</i>Predict</button><button data-p="settings"><i>⚙️</i>Settings</button></nav><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><script>
const KEY='calorieTracker_v2',TOD=()=>new Date().toISOString().slice(0,10),DEF={settings:{maintenance:2200,startWeight:70,goalWeight:65,targetDeficit:38500,calPerKg:7700},days:{}};let S=load(),P='daily',D=TOD();function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');return x&&x.settings&&x.days?x:structuredClone(DEF)}catch{return structuredClone(DEF)}}function save(){localStorage.setItem(KEY,JSON.stringify(S))}function day(d=D){if(!S.days[d])S.days[d]={maintenance:S.settings.maintenance,foods:[],burns:[]};let x=S.days[d];x.foods=x.foods||[];x.burns=x.burns||[];return x}function N(v){return Number(v)||0}function F(v){return Math.round(v).toLocaleString('en-IN')}function E(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function T(d){let x=day(d),a=x.foods.reduce((z,f)=>({cal:z.cal+N(f.cal),p:z.p+N(f.p),c:z.c+N(f.c),f:z.f+N(f.f)}),{cal:0,p:0,c:0,f:0}),b=x.burns.reduce((z,f)=>z+N(f.cal),0);return {...a,b,maintenance:N(x.maintenance),net:N(x.maintenance)+b-a.cal}}function DS(){return Object.keys(S.days).sort()}function CUM(){return DS().reduce((z,d)=>z+T(d).net,0)}function AVG(){let d=DS();return d.length?CUM()/d.length:0}function pct(a,b){return b?Math.max(0,Math.min(100,a/b*100)):0}function render(){let names={daily:'Daily',progress:'Progress Card',calendar:'Calorie Calendar',charts:'Progress Charts',prediction:'Prediction',settings:'Settings'};head.textContent=names[P];sub.textContent=P==='daily'?new Date(D+'T12:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'Stored privately on this device';document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('active',x.dataset.p===P));app.innerHTML={daily,progress,calendar,charts,prediction,settings}[P]();bind();if(P==='charts')setTimeout(drawCharts,30)}
function daily(){let x=day(),t=T(D),w=x.weight;return `<div class="card hero"><div class=row><div><span class=label>${D===TOD()?'TODAY':'SELECTED DAY'}</span><div class=big>${t.net>=0?'−':'+'}${F(Math.abs(t.net))}</div><span class=muted>${t.net>=0?'calorie deficit':'calorie surplus'}</span></div><input id=date class=input type=date value=${D} style="width:145px"></div><div class=g3 style="margin-top:15px"><div class=stat><span class=label>Food</span><b>${F(t.cal)}</b></div><div class=stat><span class=label>Maintenance</span><b>${F(t.maintenance)}</b></div><div class=stat><span class=label>Extra burn</span><b>${F(t.b)}</b></div></div></div><div class=card><div class=row><div class=title>Macros</div><span class=mini>${x.foods.length} food entries</span></div><div class=g3><div class=stat><span class=label>Protein</span><b>${F(t.p)}g</b></div><div class=stat><span class=label>Carbs</span><b>${F(t.c)}g</b></div><div class=stat><span class=label>Fat</span><b>${F(t.f)}g</b></div></div></div><div class=card><div class=row><div class=title>Food log</div><button class="btn sm" id=addFood>+ Add food</button></div>${x.foods.length?x.foods.map((f,i)=>`<div class=food><div><b>${E(f.name)}</b><div class=muted>${E(f.qty)} · ${F(f.cal)} kcal</div><div class=chips><span class=chip>P ${F(f.p)}g</span><span class=chip>C ${F(f.c)}g</span><span class=chip>F ${F(f.f)}g</span></div></div><div><button class="btn sec sm" onclick="editFood(${i})">Edit</button> <button class="btn danger sm" onclick="removeFood(${i})">Delete</button></div></div>`).join(''):'<div class=empty>No food added yet.</div>'}</div><div class=card><div class=row><div class=title>Extra calories burned</div><button class="btn sm" id=addBurn>+ Add burn</button></div>${x.burns.length?x.burns.map((b,i)=>`<div class=food><div><b>${E(b.name)}</b><div class=muted>${F(b.cal)} kcal</div></div><div><button class="btn sec sm" onclick="editBurn(${i})">Edit</button> <button class="btn danger sm" onclick="removeBurn(${i})">Delete</button></div></div>`).join(''):'<div class=empty>Walking, gym, cycling and other manually added burn.</div>'}</div><div class=card><div class=title>Day settings</div><div class=g2><div class=field><label>Maintenance kcal</label><input id=dayMaint class=input type=number value=${t.maintenance}></div><div class=field><label>Morning weight kg <span class=mini>(optional)</span></label><input id=dayWeight class=input type=number step=.1 value="${w??''}"></div></div><button id=saveDay class=btn>Save this day</button><div class=notice style="margin-top:9px">Maintenance and weight are saved only for ${D}. Previous days stay unchanged.</div></div>`}
function progress(){let s=S.settings,c=CUM(),w=s.startWeight-c/s.calPerKg,loss=s.startWeight-s.goalWeight,wp=loss?Math.max(0,Math.min(100,(s.startWeight-w)/loss*100)):0;return `<div class="card hero"><span class=label>CUMULATIVE DEFICIT</span><div class=big>${F(c)} kcal</div><div class=bar><div class=fill style="width:${pct(c,s.targetDeficit)}%"></div></div><div class=row style="margin-top:7px"><span class=muted>${pct(c,s.targetDeficit).toFixed(1)}% of target</span><span class=muted>${F(Math.max(0,s.targetDeficit-c))} remaining</span></div></div><div class=card><div class=title>Weight progress</div><div class=g2><div class=stat><span class=label>Starting</span><b>${s.startWeight.toFixed(1)} kg</b></div><div class=stat><span class=label>Goal</span><b>${s.goalWeight.toFixed(1)} kg</b></div><div class=stat><span class=label>Theoretical</span><b>${w.toFixed(1)} kg</b></div><div class=stat><span class=label>Avg deficit</span><b>${F(AVG())} kcal</b></div></div><div class=row style="margin-top:12px"><span class=mini>Weight journey</span><b>${wp.toFixed(1)}%</b></div><div class=bar><div class="fill g" style="width:${wp}%"></div></div></div><div class=card><div class=title>Actual weight logs</div>${weightLogs()}</div>`}
function weightLogs(){let a=DS().filter(d=>S.days[d].weight!=null).slice(-10).reverse();return a.length?a.map(d=>`<div class=food><span>${new Date(d+'T12:00').toLocaleDateString(undefined,{day:'numeric',month:'short'})}</span><b>${N(S.days[d].weight).toFixed(1)} kg</b></div>`).join(''):'<div class=empty>Add morning weights from the Daily page.</div>'}
function calendar(){let q=new Date(D+'T12:00'),y=q.getFullYear(),m=q.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),c=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class=calh>${x}</div>`).join('');for(let i=0;i<first;i++)c+='<div></div>';for(let i=1;i<=n;i++){let d=`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`,t=S.days[d]?T(d):null;c+=`<button class="day ${d===TOD()?'today ':''}${t?(t.net>=0?'def':'sur'):''}" onclick="openDay('${d}')"><strong>${i}</strong>${t?`<span class=${t.net>=0?'pos':'neg'}>${t.net>=0?'−':'+'}${F(Math.abs(t.net))}</span>`:''}</button>`}return `<div class=card><div class=row><button class="btn sec sm" onclick="changeMonth(-1)">‹</button><div class=title>${q.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</div><button class="btn sec sm" onclick="changeMonth(1)">›</button></div><div class=calendar>${c}</div><p class=muted>Green = deficit. Red = surplus. Tap any recorded day for the full report.</p></div>`}
function charts(){return `<div class=card><div class=title>Cumulative deficit</div><div class=chart><canvas id=defChart></canvas></div></div><div class=card><div class=title>Theoretical weight</div><div class=chart><canvas id=weightChart></canvas></div></div>`}
function prediction(){let s=S.settings,c=CUM(),r=Math.max(0,s.targetDeficit-c),a=AVG(),days=a>0?r/a:null,g=days?new Date(Date.now()+days*86400000):null;return `<div class="card hero"><div class=title>Goal prediction</div><div class=g2><div class=stat><span class=label>Remaining target</span><b>${F(r)} kcal</b></div><div class=stat><span class=label>Average deficit</span><b>${F(a)} kcal/day</b></div><div class=stat><span class=label>Estimated days</span><b>${days?Math.ceil(days):'—'}</b></div><div class=stat><span class=label>Approx. goal date</span><b>${g?g.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'—'}</b></div></div></div><div class=card>${a>0?`At your current average deficit of <b>${F(a)} kcal/day</b>, your remaining target is about <b>${Math.ceil(days)} days</b>.`:'Record some deficit days to generate a prediction.'}</div>`}
function settings(){let s=S.settings;return `<div class=card><div class=title>Goal settings</div><div class=g2><div class=field><label>Default maintenance kcal</label><input id=sm class=input type=number value=${s.maintenance}></div><div class=field><label>Starting weight kg</label><input id=sw class=input type=number step=.1 value=${s.startWeight}></div><div class=field><label>Goal weight kg</label><input id=gw class=input type=number step=.1 value=${s.goalWeight}></div><div class=field><label>Target deficit kcal</label><input id=td class=input type=number value=${s.targetDeficit}></div><div class=field><label>Calories per kg</label><input id=ck class=input type=number value=${s.calPerKg}></div></div><button class=btn id=saveSettings>Save settings</button><div class=notice style="margin-top:10px">Default maintenance is used only when a new day is created. Existing days keep their own maintenance.</div></div><div class=card><div class=title>Backup & restore</div><p class=muted>Export everything as JSON. Restore it later on this iPhone or another browser.</p><button class=btn id=exportBtn>Export backup</button> <label class="btn sec"><input id=importFile type=file accept=application/json hidden>Import backup</label></div><div class=card><div class=title>Privacy</div><p class=muted>Your entries are stored in this browser's local storage. No AI, account, analytics or external API is required.</p><button class="btn danger" id=clearBtn>Clear all data</button></div>`}
function bind(){document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{P=b.dataset.p;render()});let date=document.getElementById('date');if(date)date.onchange=e=>{D=e.target.value;render()};let af=document.getElementById('addFood');if(af)af.onclick=()=>foodModal();let ab=document.getElementById('addBurn');if(ab)ab.onclick=()=>burnModal();let sd=document.getElementById('saveDay');if(sd)sd.onclick=()=>{let x=day();x.maintenance=N(dayMaint.value);x.weight=dayWeight.value===''?undefined:N(dayWeight.value);save();render()};let ss=document.getElementById('saveSettings');if(ss)ss.onclick=()=>{S.settings={maintenance:N(sm.value),startWeight:N(sw.value),goalWeight:N(gw.value),targetDeficit:N(td.value),calPerKg:N(ck.value)};save();render()};let ex=document.getElementById('exportBtn');if(ex)ex.onclick=exportData;let im=document.getElementById('importFile');if(im)im.onchange=importData;let cl=document.getElementById('clearBtn');if(cl)cl.onclick=()=>{if(confirm('Delete all tracker data?')){S=structuredClone(DEF);save();render()}}}
function openModal(h){sheet.innerHTML=h;modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}modal.onclick=e=>{if(e.target===modal)closeModal()}
function foodForm(i){let f=i==null?{name:'',qty:'',cal:'',p:'',c:'',f:''}:day().foods[i];openModal(`<div class=row><div class=title>${i==null?'Add food':'Edit food'}</div><button class="btn sec sm" onclick=closeModal()>Close</button></div><div class=field><label>Food name</label><input id=fn class=input value="${E(f.name)}"></div><div class=field><label>Quantity</label><input id=fq class=input value="${E(f.qty)}" placeholder="150 g"></div><div class=g2><div class=field><label>Calories</label><input id=fc class=input type=number value=${f.cal}></div><div class=field><label>Protein g</label><input id=fp class=input type=number step=.1 value=${f.p}></div><div class=field><label>Carbs g</label><input id=fb class=input type=number step=.1 value=${f.c}></div><div class=field><label>Fat g</label><input id=ff class=input type=number step=.1 value=${f.f}></div></div><button class=btn style="width:100%" onclick="saveFood(${i==null?-1:i})">${i==null?'Add food':'Save changes'}</button>`)}function foodModal(){foodForm(null)}function editFood(i){foodForm(i)}function saveFood(i){let f={name:fn.value||'Food',qty:fq.value,cal:N(fc.value),p:N(fp.value),c:N(fb.value),f:N(ff.value)};if(i<0)day().foods.push(f);else day().foods[i]=f;save();closeModal();render()}function removeFood(i){day().foods.splice(i,1);save();render()}
function burnForm(i){let b=i==null?{name:'',cal:''}:day().burns[i];openModal(`<div class=row><div class=title>${i==null?'Add calories burned':'Edit activity'}</div><button class="btn sec sm" onclick=closeModal()>Close</button></div><div class=field><label>Activity</label><input id=bn class=input value="${E(b.name)}" placeholder="Walking, gym, cycling"></div><div class=field><label>Calories burned</label><input id=bc class=input type=number value=${b.cal}></div><button class=btn style="width:100%" onclick="saveBurn(${i==null?-1:i})">${i==null?'Add burn':'Save changes'}</button>`)}function burnModal(){burnForm(null)}function editBurn(i){burnForm(i)}function saveBurn(i){let b={name:bn.value||'Activity',cal:N(bc.value)};if(i<0)day().burns.push(b);else day().burns[i]=b;save();closeModal();render()}function removeBurn(i){day().burns.splice(i,1);save();render()}
function openDay(d){let t=T(d),x=day(d);openModal(`<div class=row><div><div class=title>${new Date(d+'T12:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}</div><span class=muted>${d}</span></div><button class="btn sec sm" onclick=closeModal()>Close</button></div><div class=g2 style="margin-top:10px"><div class=stat>Food<b>${F(t.cal)}</b></div><div class=stat>Maintenance<b>${F(t.maintenance)}</b></div><div class=stat>Burn<b>${F(t.b)}</b></div><div class=stat>Balance<b class=${t.net>=0?'pos':'neg'}>${t.net>=0?'Deficit ':'Surplus '}${F(Math.abs(t.net))}</b></div></div><div class=card style="margin-top:10px"><div class=title>Macros</div><div class=g3><div class=stat>Protein<b>${F(t.p)}g</b></div><div class=stat>Carbs<b>${F(t.c)}g</b></div><div class=stat>Fat<b>${F(t.f)}g</b></div></div></div>${x.foods.length?x.foods.map((f,i)=>`<div class=food><div><b>${E(f.name)}</b><div class=muted>${E(f.qty)} · ${F(f.cal)} kcal</div></div></div>`).join(''):'<div class=empty>No food recorded.</div>'}${x.weight!=null?`<div class=notice style="margin-top:10px">Morning weight: <b>${N(x.weight).toFixed(1)} kg</b></div>`:''}`)}
function changeMonth(v){let q=new Date(D+'T12:00');q.setMonth(q.getMonth()+v);D=`${q.getFullYear()}-${String(q.getMonth()+1).padStart(2,'0')}-01`;render()}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='calorie-tracker-backup-'+TOD()+'.json';a.click()}
function importData(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.settings||!x.days)throw 0;S=x;save();render();alert('Backup restored.')}catch{alert('Invalid backup file.')}};r.readAsText(file)}
function drawCharts(){drawLine(defChart,DS().map(d=>T(d).net).reduce((a,v,i)=>{a.push((a[i-1]||0)+v);return a},[0]),S.settings.targetDeficit,true);drawLine(weightChart,[S.settings.startWeight,...DS().map((d,i)=>S.settings.startWeight-DS().slice(0,i+1).reduce((a,k)=>a+T(k).net,0)/S.settings.calPerKg)],S.settings.goalWeight,false)}function drawLine(c,a,target,isDef){let ctx=c.getContext('2d'),W=c.clientWidth,H=c.clientHeight,d=devicePixelRatio||1;c.width=W*d;c.height=H*d;ctx.scale(d,d);let mn=Math.min(...a,target),mx=Math.max(...a,target);if(mn===mx){mn--;mx++}let X=i=>35+(W-48)*(i/(a.length-1||1)),Y=v=>18+(H-42)*(mx-v)/(mx-mn);ctx.strokeStyle='#dfe5ee';for(let i=0;i<5;i++){let y=18+i*(H-42)/4;ctx.beginPath();ctx.moveTo(35,y);ctx.lineTo(W-13,y);ctx.stroke()}ctx.strokeStyle='#2d6cdf';ctx.lineWidth=3;ctx.beginPath();a.forEach((v,i)=>i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v)));ctx.stroke();ctx.fillStyle='#687386';ctx.font='11px system-ui';ctx.fillText(Math.round(mx).toLocaleString(),3,23);ctx.fillText(Math.round(mn).toLocaleString(),3,H-24);ctx.fillText('Goal '+Math.round(target).toLocaleString(),W-88,12)}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});render();</script></body></html>
