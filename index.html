<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173b6c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Calorie Tracker">
<link rel="manifest" href="manifest.json">
<title>Calorie Tracker</title>
<style>
:root{--navy:#173b6c;--blue:#2f6fed;--green:#20a66a;--red:#e05252;--orange:#f29b38;--bg:#f5f7fb;--card:#fff;--text:#152238;--muted:#6d7889;--line:#e4e8ef;--radius:18px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:86px}button,input{font:inherit}button{cursor:pointer}.top{background:var(--navy);color:white;padding:20px 18px 22px;position:sticky;top:0;z-index:5}.top h1{margin:0;font-size:22px}.top p{margin:5px 0 0;opacity:.8;font-size:13px}.wrap{max-width:720px;margin:auto;padding:16px}.page{display:none}.page.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 3px 12px #1722380a}.hero{background:linear-gradient(135deg,#173b6c,#285a99);color:white;border:0}.hero .muted{color:#d9e4f3}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f7f9fc;border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{display:block;font-size:20px;margin-top:4px}.muted{color:var(--muted);font-size:13px}.label{font-size:12px;color:var(--muted);margin-bottom:5px;display:block}.value{font-weight:700}.big{font-size:32px;font-weight:800}.green{color:var(--green)}.red{color:var(--red)}.orange{color:var(--orange)}.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--blue);color:white;font-weight:700}.btn.secondary{background:#eef3fb;color:var(--navy)}.btn.danger{background:#fff0f0;color:var(--red)}.btn.small{padding:8px 10px;font-size:13px}.input{width:100%;border:1px solid var(--line);background:white;border-radius:11px;padding:11px;color:var(--text);outline:none}.input:focus{border-color:var(--blue)}.field{margin-bottom:11px}h2{font-size:18px;margin:4px 0 14px}h3{font-size:15px;margin:0 0 8px}.bar{height:12px;border-radius:99px;background:#e9edf3;overflow:hidden}.fill{height:100%;border-radius:99px;background:var(--green);transition:width .25s}.fill.blue{background:var(--blue)}.progress-label{font-size:12px;margin:7px 0 5px;display:flex;justify-content:space-between}.food{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.food:last-child{border-bottom:0}.food .name{font-weight:700}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}.chip{font-size:11px;background:#f0f3f8;border-radius:99px;padding:4px 7px;color:var(--muted)}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);z-index:10;padding-bottom:env(safe-area-inset-bottom)}.nav button{background:none;border:0;padding:9px 2px 8px;color:var(--muted);font-size:10px}.nav button.active{color:var(--blue);font-weight:800}.nav span{display:block;font-size:19px;margin-bottom:2px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calhead{text-align:center;font-size:10px;color:var(--muted);padding:4px}.day{min-height:52px;border:1px solid var(--line);border-radius:10px;background:white;padding:6px;font-size:11px}.day strong{display:block}.day.deficit{border-color:#bfe7d3;background:#f0fbf5}.day.surplus{border-color:#f3c4c4;background:#fff4f4}.day.today{outline:2px solid var(--blue)}.day.empty{background:transparent;border:0}.chart{width:100%;height:220px;display:block}.empty{text-align:center;padding:30px 10px;color:var(--muted)}.notice{background:#fff8e9;border:1px solid #f4d89d;color:#77571c;border-radius:12px;padding:10px;font-size:12px;margin-bottom:12px}.switch{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
@media(min-width:700px){.nav{max-width:720px;margin:auto;border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0}.top{position:relative}.wrap{padding-top:22px}}
</style>
</head>
<body>
<header class="top"><div class="wrap" style="padding:0"><h1>Calorie Tracker</h1><p id="subtitle">Daily progress, one day at a time.</p></div></header>
<main class="wrap">
<section id="daily" class="page active"></section>
<section id="progress" class="page"></section>
<section id="calendarPage" class="page"></section>
<section id="charts" class="page"></section>
<section id="prediction" class="page"></section>
<section id="settings" class="page"></section>
</main>
<nav class="nav">
<button data-page="daily" class="active"><span>🏠</span>Daily</button><button data-page="progress"><span>🎯</span>Progress</button><button data-page="calendarPage"><span>🗓️</span>Calendar</button><button data-page="charts"><span>📈</span>Charts</button><button data-page="prediction"><span>🔮</span>Predict</button><button data-page="settings"><span>⚙️</span>Settings</button>
</nav>
<script>
const KEY='calorieTracker_v1';
const today=()=>new Date().toISOString().slice(0,10);
const defaultData={settings:{maintenance:2200,startWeight:70,goalWeight:65,targetDeficit:38500,calPerKg:7700},days:{}};
let data=load();let selectedDate=today();
function load(){try{return {...defaultData,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return structuredClone(defaultData)}}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function day(d){if(!data.days[d])data.days[d]={maintenance:data.settings.maintenance,foods:[],burns:[]};return data.days[d]}
function n(v){return Number(v)||0} function esc(s){return String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function totals(d){let x=day(d);return {food:x.foods.reduce((a,f)=>a+n(f.cal),0),protein:x.foods.reduce((a,f)=>a+n(f.p),0),carbs:x.foods.reduce((a,f)=>a+n(f.c),0),fat:x.foods.reduce((a,f)=>a+n(f.f),0),burn:x.burns.reduce((a,b)=>a+n(b.cal),0),maintenance:n(x.maintenance),deficit:n(x.maintenance)+x.burns.reduce((a,b)=>a+n(b.cal),0)-x.foods.reduce((a,f)=>a+n(f.cal),0)}}
function allDates(){return Object.keys(data.days).sort()}
function cumulative(){return allDates().reduce((s,d)=>s+totals(d).deficit,0)}
function avgDef(){let ds=allDates().filter(d=>data.days[d].foods.length||data.days[d].burns.length||data.days[d].maintenance);return ds.length?cumulative()/ds.length:0}
function fmt(x){return Math.round(x).toLocaleString('en-IN')}
function render(){renderDaily();renderProgress();renderCalendar();renderCharts();renderPrediction();renderSettings()}
function renderDaily(){let d=day(selectedDate),t=totals(selectedDate);document.getElementById('daily').innerHTML=`<div class="card hero"><div class="row between"><div><div class="muted">${selectedDate===today()?'TODAY':'DAY'}</div><div class="big">${fmt(t.deficit)} kcal</div><div class="muted">${t.deficit>=0?'deficit':'surplus'} today</div></div><input id="datePick" class="input" type="date" value="${selectedDate}" style="width:145px"></div><div class="grid3" style="margin-top:16px"><div class="stat"><span class="muted">Food</span><b>${fmt(t.food)}</b></div><div class="stat"><span class="muted">Maintenance</span><b>${fmt(t.maintenance)}</b></div><div class="stat"><span class="muted">Extra burn</span><b>${fmt(t.burn)}</b></div></div></div>
<div class="card"><div class="row between"><h2 style="margin:0">Macros</h2><span class="muted">${fmt(t.protein)}g protein</span></div><div class="grid3" style="margin-top:12px"><div class="stat"><span class="muted">Protein</span><b>${fmt(t.protein)}g</b></div><div class="stat"><span class="muted">Carbs</span><b>${fmt(t.carbs)}g</b></div><div class="stat"><span class="muted">Fat</span><b>${fmt(t.fat)}g</b></div></div></div>
<div class="card"><div class="row between"><h2 style="margin:0">Food log</h2><button class="btn small" onclick="addFood()">+ Food</button></div>${d.foods.length?d.foods.map((f,i)=>`<div class="food"><div><div class="name">${esc(f.name)}</div><div class="muted">${fmt(f.qty)}g · ${fmt(f.cal)} kcal</div><div class="chips"><span class="chip">P ${fmt(f.p)}g</span><span class="chip">C ${fmt(f.c)}g</span><span class="chip">F ${fmt(f.f)}g</span></div></div><button class="btn danger small" onclick="removeFood(${i})">×</button></div>`).join(''):`<div class="empty">No food logged yet.</div>`}</div>
<div class="card"><div class="row between"><h2 style="margin:0">Extra calories burned</h2><button class="btn small" onclick="addBurn()">+ Burn</button></div>${d.burns.length?d.burns.map((b,i)=>`<div class="food"><div><div class="name">${esc(b.name)}</div><div class="muted">${fmt(b.cal)} kcal</div></div><button class="btn danger small" onclick="removeBurn(${i})">×</button></div>`).join(''):`<div class="empty">Add walking, gym, cycling, etc.</div>`}</div>`;
document.getElementById('datePick').onchange=e=>{selectedDate=e.target.value;render()}}
function addFood(){let name=prompt('Food name');if(!name)return;let qty=prompt('Quantity (g/ml or serving)');let cal=prompt('Calories');if(cal===null)return;let p=prompt('Protein (g)',0),c=prompt('Carbs (g)',0),f=prompt('Fat (g)',0);day(selectedDate).foods.push({name,qty:n(qty),cal:n(cal),p:n(p),c:n(c),f:n(f)});save();render()}
function removeFood(i){day(selectedDate).foods.splice(i,1);save();render()}
function addBurn(){let name=prompt('Activity (e.g. Walking)');if(!name)return;let cal=prompt('Calories burned');if(cal===null)return;day(selectedDate).burns.push({name,cal:n(cal)});save();render()}
function removeBurn(i){day(selectedDate).burns.splice(i,1);save();render()}
function renderProgress(){let cum=cumulative(), target=n(data.settings.targetDeficit), pct=target?Math.max(0,Math.min(100,cum/target*100)):0;let sw=n(data.settings.startWeight),gw=n(data.settings.goalWeight),theory=sw-cum/n(data.settings.calPerKg),weightPct=(sw-gw)?Math.max(0,Math.min(100,(sw-theory)/(sw-gw)*100)):0;document.getElementById('progress').innerHTML=`<div class="card hero"><div class="muted">TOTAL PROGRESS</div><div class="big">${fmt(cum)} kcal</div><div class="muted">cumulative deficit</div><div class="progress-label"><span>Deficit goal</span><b>${fmt(target)} kcal</b></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div><div class="progress-label"><span>${pct.toFixed(1)}% complete</span><span>${fmt(Math.max(0,target-cum))} kcal remaining</span></div></div>
<div class="card"><h2>Weight projection</h2><div class="grid2"><div class="stat"><span class="muted">Starting</span><b>${sw.toFixed(1)} kg</b></div><div class="stat"><span class="muted">Goal</span><b>${gw.toFixed(1)} kg</b></div><div class="stat"><span class="muted">Theoretical now</span><b>${theory.toFixed(1)} kg</b></div><div class="stat"><span class="muted">Avg daily deficit</span><b>${fmt(avgDef())} kcal</b></div></div><div class="progress-label"><span>Weight journey</span><span>${weightPct.toFixed(1)}%</span></div><div class="bar"><div class="fill blue" style="width:${weightPct}%"></div></div></div>
<div class="card"><h2>Goal settings</h2><div class="grid2"><div><span class="label">Target deficit</span><div class="value">${fmt(target)} kcal</div></div><div><span class="label">Calories per kg</span><div class="value">${fmt(data.settings.calPerKg)} kcal</div></div></div></div>`}
function renderCalendar(){let now=new Date(selectedDate);let y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let cells='';['S','M','T','W','T','F','S'].forEach(x=>cells+=`<div class="calhead">${x}</div>`);for(let i=0;i<first;i++)cells+='<div class="day empty"></div>';for(let d=1;d<=days;d++){let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;let has=data.days[ds],t=has?totals(ds):null;let cls=t?(t.deficit>=0?'deficit':'surplus')+(ds===today()?' today':''):'';cells+=`<button class="day ${cls}" onclick="selectCal('${ds}')"><strong>${d}</strong>${t?`<span>${t.deficit>=0?'+':''}${fmt(t.deficit)}</span>`:''}</button>`}document.getElementById('calendarPage').innerHTML=`<div class="card"><div class="row between"><button class="btn secondary small" onclick="changeMonth(-1)">‹</button><h2 style="margin:0">${now.toLocaleString('en',{month:'long',year:'numeric'})}</h2><button class="btn secondary small" onclick="changeMonth(1)">›</button></div><div class="calendar" style="margin-top:14px">${cells}</div><div class="muted" style="margin-top:12px">Green = deficit · Red = surplus. Tap a day to open its report.</div></div>`}
function selectCal(d){selectedDate=d;show('daily')};function changeMonth(x){let d=new Date(selectedDate);d.setMonth(d.getMonth()+x);selectedDate=d.toISOString().slice(0,10);render()}
function chartSVG(values,maxY,label,colorClass){let w=640,h=230,p=35;let max=Math.max(maxY,1),min=values.length?Math.min(...values):0;let range=Math.max(max-min,1);let pts=values.map((v,i)=>`${p+i*(w-2*p)/Math.max(values.length-1,1)},${h-p-(v-min)/range*(h-2*p)}`).join(' ');return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" stroke="#dfe4eb"/><line x1="${p}" y1="${p}" x2="${p}" y2="${h-p}" stroke="#dfe4eb"/><polyline fill="none" stroke="${colorClass}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" points="${pts}"/>${values.length?`<circle cx="${p+(values.length-1)*(w-2*p)/Math.max(values.length-1,1)}" cy="${h-p-(values.at(-1)-min)/range*(h-2*p)}" r="6" fill="${colorClass}"/>`:''}</svg>`}
function renderCharts(){let ds=allDates(),cum=0,cv=[0],wv=[n(data.settings.startWeight)];ds.forEach(d=>{cum+=totals(d).deficit;cv.push(cum);wv.push(n(data.settings.startWeight)-cum/n(data.settings.calPerKg))});let target=n(data.settings.targetDeficit),gw=n(data.settings.goalWeight);document.getElementById('charts').innerHTML=`<div class="card"><h2>Cumulative deficit</h2>${chartSVG(cv,target,'',' #2f6fed')}<div class="row between muted"><span>0 kcal</span><span>Goal ${fmt(target)} kcal</span></div></div><div class="card"><h2>Theoretical weight</h2>${chartSVG(wv,n(data.settings.startWeight),'', '#20a66a')}<div class="row between muted"><span>${n(data.settings.startWeight).toFixed(1)} kg</span><span>Goal ${gw.toFixed(1)} kg</span></div></div><div class="card"><div class="muted">Charts use your logged days and the stored ${fmt(data.settings.calPerKg)} kcal/kg conversion.</div></div>`}
function renderPrediction(){let remain=Math.max(0,n(data.settings.targetDeficit)-cumulative()),avg=avgDef(),days=avg>0?Math.ceil(remain/avg):null;let date=days?new Date(Date.now()+days*86400000):null;document.getElementById('prediction').innerHTML=`<div class="card hero"><div class="muted">PREDICTION</div><h2 style="color:white;font-size:24px;margin:5px 0 8px">${days?days+' days remaining':'Not enough deficit data yet'}</h2><div class="muted">${days?'At your current average daily deficit':'Log more days with food/burn data to estimate your timeline.'}</div></div><div class="card"><div class="grid2"><div class="stat"><span class="muted">Remaining target</span><b>${fmt(remain)} kcal</b></div><div class="stat"><span class="muted">Average deficit</span><b>${fmt(avg)} kcal/day</b></div><div class="stat"><span class="muted">Approx. goal date</span><b>${date?date.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'—'}</b></div><div class="stat"><span class="muted">Current theoretical weight</span><b>${(n(data.settings.startWeight)-cumulative()/n(data.settings.calPerKg)).toFixed(1)} kg</b></div></div></div><div class="notice">This is a theoretical estimate based only on your logged calorie balance. Real scale weight can move differently because of water, glycogen, digestion and other factors.</div>`}
function renderSettings(){let s=data.settings;document.getElementById('settings').innerHTML=`<div class="card"><h2>Goal & profile</h2><div class="grid2"><div class="field"><span class="label">Starting weight (kg)</span><input class="input" id="sw" type="number" step="0.1" value="${s.startWeight}"></div><div class="field"><span class="label">Goal weight (kg)</span><input class="input" id="gw" type="number" step="0.1" value="${s.goalWeight}"></div><div class="field"><span class="label">Target deficit (kcal)</span><input class="input" id="td" type="number" value="${s.targetDeficit}"></div><div class="field"><span class="label">Calories per kg</span><input class="input" id="ck" type="number" value="${s.calPerKg}"></div></div><button class="btn" onclick="saveSettings()">Save goal settings</button></div><div class="card"><h2>Default maintenance</h2><div class="field"><span class="label">New default maintenance for new days</span><input class="input" id="maint" type="number" value="${s.maintenance}"></div><div class="muted">Changing this default will not alter any existing day. Each day stores its own maintenance value.</div></div><div class="card"><h2>Backup & restore</h2><div class="row"><button class="btn" onclick="backup()">Export backup</button><label class="btn secondary" style="display:inline-block">Import backup<input type="file" accept="application/json" onchange="restore(event)" style="display:none"></label></div><div style="margin-top:12px"><button class="btn danger" onclick="resetAll()">Delete all data</button></div></div><div class="card"><h2>iPhone</h2><div class="muted">For the best experience, open the GitHub Pages site in Safari and use Share → Add to Home Screen. Your data stays in this browser's local storage.</div></div>`}
function saveSettings(){data.settings.startWeight=n(sw.value);data.settings.goalWeight=n(gw.value);data.settings.targetDeficit=n(td.value);data.settings.calPerKg=n(ck.value);data.settings.maintenance=n(maint.value);save();render()}
function backup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`calorie-tracker-backup-${today()}.json`;a.click();URL.revokeObjectURL(a.href)}
function restore(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.settings||!x.days)throw 0;data=x;save();render();alert('Backup restored.')}catch{alert('Invalid backup file.')}};r.readAsText(file)}
function resetAll(){if(confirm('Delete all calorie tracker data? This cannot be undone unless you have a backup.')){localStorage.removeItem(KEY);data=structuredClone(defaultData);render()}}
function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===id));window.scrollTo(0,0)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.page));
render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
</script>
</body></html>
