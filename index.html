<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b67"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Calories"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg"><title>Calorie Tracker</title><style>
:root{--n:#173b67;--b:#2d6cdf;--g:#159c61;--r:#d64b4b;--bg:#f5f7fb;--card:#fff;--t:#172033;--m:#687386;--l:#e1e6ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;padding-bottom:82px}.wrap{max-width:760px;margin:auto}.top{background:var(--n);color:#fff;padding:18px 16px}.top h1{margin:0;font-size:23px}.top p{margin:4px 0 0;font-size:13px;opacity:.78}.main{padding:15px}.card{background:var(--card);border:1px solid var(--l);border-radius:18px;padding:15px;margin-bottom:13px;box-shadow:0 3px 14px #173b6708}.hero{background:linear-gradient(135deg,#173b67,#2d5e95);color:#fff;border:0}.hero .muted{color:#d8e3f0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f7f9fc;border:1px solid var(--l);border-radius:13px;padding:11px}.stat b{display:block;font-size:19px;margin-top:4px}.label,.muted{font-size:12px;color:var(--m)}.hero .label{color:#d8e3f0}.big{font-size:32px;font-weight:800;margin:4px 0}.title{font-size:17px;font-weight:750;margin:2px 0 11px}.btn{border:0;border-radius:11px;padding:10px 13px;background:var(--b);color:#fff;font-weight:700}.btn.sec{background:#edf3fb;color:var(--n)}.btn.danger{background:#fff0f0;color:var(--r)}.btn.sm{padding:7px 9px;font-size:12px}.input{width:100%;padding:10px;border:1px solid var(--l);border-radius:10px;background:#fff;color:var(--t)}.field{margin-bottom:10px}.field label{display:block;font-size:12px;color:var(--m);margin-bottom:4px}.bar{height:11px;background:#e9edf3;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--b);border-radius:99px}.fill.g{background:var(--g)}.food{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid var(--l)}.food:last-child{border-bottom:0}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}.chip{background:#f0f3f7;border-radius:99px;padding:4px 7px;font-size:11px;color:var(--m)}.pos{color:var(--g)}.neg{color:var(--r)}.notice{background:#eef5ff;color:#294f7b;border-radius:11px;padding:10px;font-size:12px}.empty{text-align:center;padding:24px;color:var(--m)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calh{text-align:center;color:var(--m);font-size:10px;padding:4px}.day{min-height:53px;border:1px solid var(--l);border-radius:10px;background:#fff;padding:5px;font-size:10px}.day strong{display:block;font-size:13px}.day.def{background:#effaf4;border-color:#bde5cf}.day.sur{background:#fff3f3;border-color:#efc1c1}.day.today{outline:2px solid var(--b)}.chart{height:230px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--l);z-index:20;display:grid;grid-template-columns:repeat(6,1fr);padding:5px 3px calc(5px + env(safe-area-inset-bottom))}.nav button{border:0;background:none;color:#788396;font-size:10px}.nav button.active{color:var(--n);font-weight:800}.nav i{font-style:normal;font-size:18px;display:block}.modal{position:fixed;inset:0;background:#07162b88;display:none;align-items:flex-end;z-index:30}.modal.show{display:flex}.sheet{width:100%;max-width:760px;margin:auto;background:#fff;border-radius:20px 20px 0 0;padding:17px;max-height:90vh;overflow:auto}@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:20px}}
</style></head><body><header class="top"><div class="wrap"><h1 id="head">Daily</h1><p id="sub"></p></div></header><main class="wrap main" id="app"></main><nav class="nav"><button data-p="daily"><i>🏠</i>Daily</button><button data-p="progress"><i>🎯</i>Progress</button><button data-p="calendar"><i>🗓️</i>Calendar</button><button data-p="charts"><i>📈</i>Charts</button><button data-p="prediction"><i>🔮</i>Predict</button><button data-p="settings"><i>⚙️</i>Settings</button></nav><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><script>
const KEY='calorieTracker_v2',TOD=()=>new Date().toISOString().slice(0,10),DEF={settings:{maintenance:2200,startWeight:70,goalWeight:65,targetDeficit:38500,calPerKg:7700},days:{}};let S=load(),P='daily',D=TOD();function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');return x&&x.settings&&x.days?x:structuredClone(DEF)}catch{return structuredClone(DEF)}}function save(){localStorage.setItem(KEY,JSON.stringify(S))}function day(d=D){if(!S.days[d])S.days[d]={maintenance:S.settings.maintenance,foods:[],burns:[]};return S.days[d]}function N(v){return Number(v)||0}function F(v){return Math.round(v).toLocaleString('en-IN')}function E(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function T(d){let x=day(d);let a=x.foods.reduce((z,f)=>({cal:z.cal+N(f.cal),p:z.p+N(f.p),c:z.c+N(f.c),f:z.f+N(f.f)}),{cal:0,p:0,c:0,f:0}),b=x.burns.reduce((z,f)=>z+N(f.cal),0);return {...a,b,maintenance:N(x.maintenance),net:N(x.maintenance)+b-a.cal}}function DS(){return Object.keys(S.days).sort()}function CUM(){return DS().reduce((z,d)=>z+T(d).net,0)}function AVG(){let d=DS();return d.length?CUM()/d.length:0}function pct(a,b){return b?Math.max(0,Math.min(100,a/b*100)):0}
function render(){let title={daily:'Daily',progress:'Progress Card',calendar:'Calorie Calendar',charts:'Progress Charts',prediction:'Prediction',settings:'Settings'}[P];head.textContent=title;sub.textContent=P==='daily'?new Date(D+'T12:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'Stored privately on this device';document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('active',x.dataset.p===P));app.innerHTML={daily:daily,progress:progress,calendar:calendar,charts:charts,prediction:prediction,settings:settings}[P]();bind();if(P==='charts')setTimeout(drawCharts,20)}
function daily(){let x=day(),t=T(D);return `<div class="card hero"><div class=row><div><span class=label>${D===TOD()?'TODAY':'SELECTED DAY'}</span><div class=big>${t.net>=0?'−':'+'}${F(Math.abs(t.net))}</div><span class=muted>${t.net>=0?'calorie deficit':'calorie surplus'}</span></div><input id=date class=input type=date value=${D} style="width:145px"></div><div class=grid3 style="margin-top:15px"><div class=stat><span class=label>Food</span><b>${F(t.cal)}</b></div><div class=stat><span class=label>Maintenance</span><b>${F(t.maintenance)}</b></div><div class=stat><span class=label>Extra burn</span><b>${F(t.b)}</b></div></div></div><div class=card><div class=title>Macros</div><div class=grid3><div class=stat><span class=label>Protein</span><b>${F(t.p)}g</b></div><div class=stat><span class=label>Carbs</span><b>${F(t.c)}g</b></div><div class=stat><span class=label>Fat</span><b>${F(t.f)}g</b></div></div></div><div class=card><div class=row><div class=title>Food log</div><button class="btn sm" id=addFood>+ Add food</button></div>${x.foods.length?x.foods.map((f,i)=>`<div class=food><div><b>${E(f.name)}</b><div class=muted>${E(f.qty)} · ${F(f.cal)} kcal</div><div class=chips><span class=chip>P ${F(f.p)}g</span><span class=chip>C ${F(f.c)}g</span><span class=chip>F ${F(f.f)}g</span></div></div><button class="btn danger sm" onclick="removeFood(${i})">Delete</button></div>`).join(''):'<div class=empty>No food added yet.</div>'}</div><div class=card><div class=row><div class=title>Extra calories burned</div><button class="btn sm" id=addBurn>+ Add burn</button></div>${x.burns.length?x.burns.map((b,i)=>`<div class=food><div><b>${E(b.name)}</b><div class=muted>${F(b.cal)} kcal</div></div><button class="btn danger sm" onclick="removeBurn(${i})">Delete</button></div>`).join(''):'<div class=empty>Walking, gym, cycling and other manually added burn.</div>'}</div><div class=card><div class=title>Maintenance for this day</div><div class=grid2><div class=field><label>Maintenance kcal</label><input id=dayMaint class=input type=number value=${t.maintenance}></div><button id=saveDay class=btn style="margin-top:18px">Save today</button></div><div class=notice style="margin-top:4px">This value belongs only to ${D}. Changing it will never rewrite previous days.</div></div>`}
function progress(){let s=S.settings,c=CUM(),w=s.startWeight-c/s.calPerKg,loss=s.startWeight-s.goalWeight;return `<div class="card hero"><span class=label>CUMULATIVE DEFICIT</span><div class=big>${F(c)} kcal</div><div class=progress-label><span>Target</span><span>${F(s.targetDeficit)} kcal</span></div><div class=bar><div class=fill style="width:${pct(c,s.targetDeficit)}%"></div></div><div class=progress-label><span>${pct(c,s.targetDeficit).toFixed(1)}% complete</span><span>${F(Math.max(0,s.targetDeficit-c))} remaining</span></div></div><div class=card><div class=title>Weight progress</div><div class=grid2><div class=stat><span class=label>Starting weight</span><b>${s.startWeight.toFixed(1)} kg</b></div><div class=stat><span class=label>Goal weight</span><b>${s.goalWeight.toFixed(1)} kg</b></div><div class=stat><span class=label>Theoretical weight</span><b>${w.toFixed(1)} kg</b></div><div class=stat><span class=label>Average daily deficit</span><b>${F(AVG())} kcal</b></div></div><div class=progress-label><span>Weight journey</span><span>${loss?Math.max(0,Math.min(100,(S.settings.startWeight-w)/loss*100)).toFixed(1):0}%</span></div><div class=bar><div class="fill g" style="width:${loss?Math.max(0,Math.min(100,(S.settings.startWeight-w)/loss*100)):0}%"></div></div></div><div class=card><div class=title>Goal numbers</div><div class=grid2><div><span class=label>Target deficit</span><b>${F(s.targetDeficit)} kcal</b></div><div><span class=label>Calories per kg</span><b>${F(s.calPerKg)} kcal/kg</b></div></div></div>`}
function calendar(){let q=new Date(D+'T12:00'),y=q.getFullYear(),m=q.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),c=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class=calh>${x}</div>`).join('');for(let i=0;i<first;i++)c+='<div></div>';for(let i=1;i<=n;i++){let d=`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`,t=S.days[d]?T(d):null;c+=`<button class="day ${d===TOD()?'today ':''}${t?(t.net>=0?'def':'sur'):''}" onclick="openDay('${d}')"><strong>${i}</strong>${t?`<span class=${t.net>=0?'pos':'neg'}>${t.net>=0?'−':'+'}${F(Math.abs(t.net))}</span>`:''}</button>`}return `<div class=card><div class=row><button class="btn sec sm" onclick="changeMonth(-1)">‹</button><div class=title>${q.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</div><button class="btn sec sm" onclick="changeMonth(1)">›</button></div><div class=calendar>${c}</div><p class=muted>Green = deficit. Red = surplus. Tap any recorded day for the full report.</p></div>`}
function charts(){return `<div class=card><div class=title>Cumulative deficit</div><div class=chart><canvas id=defChart></canvas></div></div><div class=card><div class=title>Theoretical weight</div><div class=chart><canvas id=weightChart></canvas></div></div>`}
function prediction(){let s=S.settings,c=CUM(),r=Math.max(0,s.targetDeficit-c),a=AVG(),days=a>0?r/a:null,g=days?new Date(Date.now()+days*86400000):null;return `<div class=card hero><div class=title>Goal prediction</div><div class=grid2><div class=stat><span class=label>Remaining target</span><b>${F(r)} kcal</b></div><div class=stat><span class=label>Current average</span><b>${F(a)} kcal/day</b></div><div class=stat><span class=label>Estimated days</span><b>${days?Math.ceil(days):'—'}</b></div><div class=stat><span class=label>Approx. goal date</span><b>${g?g.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'—'}</b></div></div></div><div class=card>${a>0?`At your current average daily deficit of <b>${F(a)} kcal</b>, you have about <b>${Math.ceil(days)} days</b> remaining.`:'Once you have recorded days with a deficit, the app will estimate your time to goal.'}</div>`}
function settings(){let s=S.settings;return `<div class=card><div class=title>Goal settings</div><div class=grid2><div class=field><label>Default maintenance kcal</label><input id=sm class=input type=number value=${s.maintenance}></div><div class=field><label>Starting weight kg</label><input id=sw class=input type=number step=.1 value=${s.startWeight}></div><div class=field><label>Goal weight kg</label><input id=gw class=input type=number step=.1 value=${s.goalWeight}></div><div class=field><label>Target deficit kcal</label><input id=st class=input type=number value=${s.targetDeficit}></div><div class=field><label>Calories per kg</label><input id=sk class=input type=number value=${s.calPerKg}></div></div><button class=btn id=saveSettings>Save settings</button><div class=notice style="margin-top:10px">Default maintenance applies only when a new day is created. Existing days keep their own maintenance.</div></div><div class=card><div class=title>Backup & restore</div><p class=muted>Export your complete tracker as JSON. Restore it later on this device or another browser.</p><button class=btn id=export>Export backup</button> <label class="btn sec"><input id=import type=file accept=application/json hidden>Import backup</label></div><div class=card><div class=title>Privacy</div><p class=muted>Your data is stored in this browser's local storage. No AI, login, analytics, database or external API is used.</p><button class="btn danger" id=clear>Clear all data</button></div>`}
function bind(){document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{P=b.dataset.p;render()});let x=document.getElementById('date');if(x)x.onchange=e=>{D=e.target.value;render()};let b=document.getElementById('addFood');if(b)b.onclick=foodModal;b=document.getElementById('addBurn');if(b)b.onclick=burnModal;b=document.getElementById('saveDay');if(b)b.onclick=()=>{day().maintenance=N(dayMaint.value);save();render()};b=document.getElementById('saveSettings');if(b)b.onclick=()=>{S.settings={maintenance:N(sm.value),startWeight:N(sw.value),goalWeight:N(gw.value),targetDeficit:N(st.value),calPerKg:N(sk.value)};save();render()};b=document.getElementById('export');if(b)b.onclick=exportData;b=document.getElementById('import');if(b)b.onchange=importData;b=document.getElementById('clear');if(b)b.onclick=()=>{if(confirm('Delete all tracker data? This cannot be undone unless you have a backup.')){S=structuredClone(DEF);localStorage.removeItem(KEY);save();render()}}}
function show(h){sheet.innerHTML=h;modal.classList.add('show')}function close(){modal.classList.remove('show')}modal.onclick=e=>{if(e.target===modal)close()}
function foodModal(){show(`<div class=row><div class=title>Add food</div><button class="btn sec sm" onclick=close()>Close</button></div><div class=field><label>Food name</label><input id=fn class=input placeholder="Chicken breast"></div><div class=field><label>Quantity</label><input id=fq class=input placeholder="150 g"></div><div class=grid2><div class=field><label>Calories</label><input id=fc class=input type=number></div><div class=field><label>Protein g</label><input id=fp class=input type=number step=.1></div><div class=field><label>Carbs g</label><input id=fcb class=input type=number step=.1></div><div class=field><label>Fat g</label><input id=ff class=input type=number step=.1></div></div><button class=btn style="width:100%" onclick=addFood()>Add food</button>`)}function addFood(){if(!fn.value.trim())return alert('Enter a food name.');day().foods.push({name:fn.value.trim(),qty:fq.value.trim(),cal:N(fc.value),p:N(fp.value),c:N(fcb.value),f:N(ff.value)});save();close();render()}function removeFood(i){day().foods.splice(i,1);save();render()}function burnModal(){show(`<div class=row><div class=title>Add calories burned</div><button class="btn sec sm" onclick=close()>Close</button></div><div class=field><label>Activity</label><input id=bn class=input placeholder="Walking, gym, cycling"></div><div class=field><label>Calories burned</label><input id=bc class=input type=number></div><button class=btn style="width:100%" onclick=addBurn()>Add burn</button>`)}function addBurn(){if(!bn.value.trim())return alert('Enter an activity.');day().burns.push({name:bn.value.trim(),cal:N(bc.value)});save();close();render()}function removeBurn(i){day().burns.splice(i,1);save();render()}
function openDay(d){D=d;let x=day(d),t=T(d);show(`<div class=row><div><div class=title>${new Date(d+'T12:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}</div><span class=muted>${d}</span></div><button class="btn sec sm" onclick=close()>Close</button></div><div class=grid2 style="margin-top:10px"><div class=stat><span class=label>Food</span><b>${F(t.cal)} kcal</b></div><div class=stat><span class=label>Maintenance</span><b>${F(t.maintenance)}</b></div><div class=stat><span class=label>Added burn</span><b>${F(t.b)}</b></div><div class=stat><span class=label>Balance</span><b class=${t.net>=0?'pos':'neg'}>${t.net>=0?'Deficit ':'Surplus '}${F(Math.abs(t.net))}</b></div></div><div class=card style="margin-top:10px"><div class=title>Macros</div><div class=grid3><div class=stat>P<b>${F(t.p)}g</b></div><div class=stat>C<b>${F(t.c)}g</b></div><div class=stat>F<b>${F(t.f)}g</b></div></div></div><div class=title>Food</div>${x.foods.length?x.foods.map(f=>`<div class=food><div><b>${E(f.name)}</b><div class=muted>${E(f.qty)} · ${F(f.cal)} kcal</div></div></div>`).join(''):'<div class=empty>No food recorded.</div>'}`)}function changeMonth(v){let q=new Date(D+'T12:00');q.setMonth(q.getMonth()+v);D=`${q.getFullYear()}-${String(q.getMonth()+1).padStart(2,'0')}-01`;render()}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download=`calorie-tracker-${TOD()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.settings||!x.days)throw 0;S=x;save();render();alert('Backup restored.')}catch{alert('Invalid backup file.')}};r.readAsText(f)}
function drawCharts(){let s=S.settings,ds=DS(),def=[0],wt=[s.startWeight],c=0;ds.forEach(d=>{c+=T(d).net;def.push(c);wt.push(s.startWeight-c/s.calPerKg)});line(def,s.targetDeficit,'defChart');line(wt,s.goalWeight,'weightChart')}function line(vals,target,id){let c=document.getElementById(id),ctx=c.getContext('2d'),w=c.clientWidth,h=c.clientHeight,d=devicePixelRatio||1;c.width=w*d;c.height=h*d;ctx.scale(d,d);let mn=Math.min(...vals,target),mx=Math.max(...vals,target);if(mn===mx){mn--;mx++}let X=i=>35+(w-48)*i/(vals.length-1||1),Y=v=>15+(h-40)*(mx-v)/(mx-mn);ctx.strokeStyle='#dfe5ee';ctx.lineWidth=1;for(let i=0;i<5;i++){let y=15+i*(h-40)/4;ctx.beginPath();ctx.moveTo(35,y);ctx.lineTo(w-13,y);ctx.stroke()}ctx.strokeStyle='#2d6cdf';ctx.lineWidth=3;ctx.beginPath();vals.forEach((v,i)=>i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v)));ctx.stroke();ctx.fillStyle='#687386';ctx.font='11px system-ui';ctx.fillText(Math.round(mx).toLocaleString(),3,20);ctx.fillText(Math.round(mn).toLocaleString(),3,h-22);ctx.fillText('Goal '+Math.round(target).toLocaleString(),w-82,12)}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
