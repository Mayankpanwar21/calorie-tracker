<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07152f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Calories"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg"><title>Calorie Tracker</title><style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#101a2d;--muted:#748198;--navy:#07152f;--blue:#3478ff;--cyan:#55d8ff;--green:#22c77a;--red:#ff5968;--gold:#ffc857;--line:#e1e7f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;padding-bottom:90px}.wrap{max-width:780px;margin:auto}.top{background:linear-gradient(145deg,#061128,#12345f 65%,#1a548c);color:#fff;padding:18px 16px 22px;position:sticky;top:0;z-index:10;box-shadow:0 8px 30px #07152f33}.top h1{margin:0;font-size:25px}.top p{margin:5px 0 0;color:#b8c9df;font-size:12px}.main{padding:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 12px 35px #10203c0c}.hero{color:#fff;border:0;background:radial-gradient(circle at 90% 5%,#3d79b6 0,transparent 33%),linear-gradient(145deg,#07142f,#12365f 70%,#1b568b);overflow:hidden}.hero .stat{background:#ffffff12;border-color:#ffffff1c;color:#fff}.hero .label,.hero .muted{color:#bcd0e8}.label{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--muted)}.muted{font-size:12px;color:var(--muted)}.title{font-size:17px;font-weight:850;margin-bottom:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f7f9fc;border:1px solid var(--line);border-radius:15px;padding:12px}.stat b{display:block;font-size:18px;margin-top:4px}.balance{font-size:44px;font-weight:900;letter-spacing:-2px;line-height:1;margin:8px 0}.balance.def{color:#5df0aa}.balance.sur{color:#ff7b85}.balance.zero{color:#fff}.caption{font-size:13px;font-weight:700}.btn{border:0;border-radius:13px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:800;box-shadow:0 5px 15px #3478ff33;cursor:pointer}.btn.secondary{background:#edf3ff;color:#2455a8;box-shadow:none}.btn.danger{background:#fff0f2;color:#d83d4d;box-shadow:none}.btn.small{padding:8px 10px;font-size:12px}.input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-size:15px}.field{margin-bottom:10px}.field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:var(--muted);margin-bottom:5px}.food{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.food:last-child{border-bottom:0}.foodname{font-weight:800}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.chip{background:#f0f3f8;border-radius:99px;padding:4px 8px;font-size:10px;color:#64738b}.empty{text-align:center;padding:25px 10px;color:var(--muted);font-size:13px}.bar{height:12px;background:#e8edf4;border-radius:99px;overflow:hidden}.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#3478ff,#55d8ff)}.fill.green{background:linear-gradient(90deg,#19b96f,#55e2a0)}.fill.gold{background:linear-gradient(90deg,#f0a900,#ffd66e)}.ring{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) var(--p),#ffffff18 0);position:relative}.ring:after{content:"";position:absolute;inset:10px;background:#12365f;border-radius:50%}.ring span{position:relative;z-index:1;text-align:center}.ring b{display:block;font-size:25px}.nav{position:fixed;left:0;right:0;bottom:0;background:#ffffffed;backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:20;display:grid;grid-template-columns:repeat(6,1fr);padding:7px 3px calc(7px + env(safe-area-inset-bottom))}.nav button{border:0;background:none;color:#8290a4;font-size:9px;font-weight:700}.nav button.active{color:var(--blue)}.nav i{display:block;font-style:normal;font-size:20px;margin-bottom:2px}.modal{display:none;position:fixed;inset:0;background:#031022aa;z-index:50;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:780px;margin:auto;border-radius:24px 24px 0 0;padding:18px;max-height:92vh;overflow:auto}.sheet h2{margin:0 0 5px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calhead{text-align:center;font-size:10px;color:var(--muted);font-weight:800;padding:5px}.calday{min-height:58px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:6px;text-align:left}.calday strong{display:block}.calday.def{background:#edfbf4;border-color:#b9e9d2}.calday.sur{background:#fff0f2;border-color:#f4c4ca}.calday.today{outline:2px solid var(--blue)}.chart{height:240px}.chart canvas{width:100%;height:100%}@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:24px}.nav{left:50%;right:auto;transform:translateX(-50%);width:780px}}
</style></head><body><header class="top"><div class="wrap"><h1 id="pageTitle">Daily</h1><p id="pageSub"></p></div></header><main class="wrap main" id="app"></main><nav class="nav"><button data-page="daily"><i>⌂</i>Daily</button><button data-page="progress"><i>◉</i>Progress</button><button data-page="calendar"><i>▦</i>Calendar</button><button data-page="charts"><i>⌁</i>Charts</button><button data-page="prediction"><i>◈</i>Predict</button><button data-page="settings"><i>⚙</i>Settings</button></nav><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><script>
const KEY='calorieTracker_v4',TOD=()=>new Date().toISOString().slice(0,10),DEFAULT={settings:{maintenance:2200,startWeight:70,goalWeight:65,targetDeficit:38500,calPerKg:7700},days:{}};let S=load(),page='daily',selected=TOD();
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.settings&&x.days)return x;let old=JSON.parse(localStorage.getItem('calorieTracker_v3')||localStorage.getItem('calorieTracker_v2')||'null');return old&&old.settings&&old.days?old:structuredClone(DEFAULT)}catch{return structuredClone(DEFAULT)}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}function getDay(d=selected){if(!S.days[d])S.days[d]={maintenance:S.settings.maintenance,foods:[],burns:[]};let x=S.days[d];x.foods=x.foods||[];x.burns=x.burns||[];return x}function n(v){return Number(v)||0}function fmt(v){return Math.round(v).toLocaleString('en-IN')}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function totals(d){let x=getDay(d),f=x.foods.reduce((a,z)=>({cal:a.cal+n(z.cal),p:a.p+n(z.p),c:a.c+n(z.c),fat:a.fat+n(z.fat)}),{cal:0,p:0,c:0,fat:0}),burn=x.burns.reduce((a,z)=>a+n(z.cal),0);let has=x.foods.length>0;return {...f,burn,maintenance:n(x.maintenance),balance:has?f.cal-n(x.maintenance)-burn:0,has}}
function tracked(){return Object.keys(S.days).filter(d=>S.days[d].foods?.length||S.days[d].burns?.length||S.days[d].weight!=null).sort()}
function cumulativeDeficit(){return tracked().reduce((a,d)=>a+totals(d).balance,0)}function avgBalance(){let a=tracked();return a.length?cumulativeDeficit()/a.length:0}
function render(){const names={daily:'Daily',progress:'Progress Card',calendar:'Calorie Calendar',charts:'Progress Charts',prediction:'Prediction',settings:'Settings'};pageTitle.textContent=names[page];pageSub.textContent=page==='daily'?new Date(selected+'T12:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'Private • stored on this device';document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));app.innerHTML={daily,progress,calendar,charts,prediction,settings}[page]();bind();if(page==='charts')setTimeout(drawCharts,30)}
function daily(){let x=getDay(),t=totals(),cls=!t.has?'zero':t.balance<0?'def':'sur';return `<section class="card hero"><div class="row"><div><span class="label">${selected===TOD()?'TODAY':'SELECTED DAY'}</span><div class="balance ${cls}">${t.has?(t.balance<0?'−':'+')+fmt(Math.abs(t.balance)):'0'}</div><div class="caption">${!t.has?'Start logging to calculate your balance':t.balance<0?'CALORIE DEFICIT':'CALORIE SURPLUS'}</div></div><input id="date" class="input" type="date" value="${selected}" style="width:145px"></div><div class="grid3" style="margin-top:18px"><div class="stat"><span class="label">Food</span><b>${fmt(t.cal)} kcal</b></div><div class="stat"><span class="label">Maintenance</span><b>${fmt(t.maintenance)}</b></div><div class="stat"><span class="label">Extra burn</span><b>${fmt(t.burn)} kcal</b></div></div></section><section class="card"><div class="title">Macro snapshot</div><div class="grid3"><div class="stat"><span class="label">Protein</span><b>${fmt(t.p)}g</b></div><div class="stat"><span class="label">Carbs</span><b>${fmt(t.c)}g</b></div><div class="stat"><span class="label">Fat</span><b>${fmt(t.fat)}g</b></div></div></section><section class="card"><div class="row"><div class="title">Food log</div><button class="btn small" id="addFood">＋ Add food</button></div>${x.foods.length?x.foods.map((f,i)=>`<div class="food"><div><div class="foodname">${esc(f.name)}</div><span class="muted">${esc(f.qty)} · ${fmt(f.cal)} kcal</span><div class="chips"><span class="chip">P ${fmt(f.p)}g</span><span class="chip">C ${fmt(f.c)}g</span><span class="chip">F ${fmt(f.fat)}g</span></div></div><div><button class="btn secondary small" onclick="foodForm(${i})">Edit</button></div></div>`).join(''):'<div class="empty"><b>No food logged</b><br>Add your first food above.</div>'}</section><section class="card"><div class="row"><div class="title">Extra calories burned</div><button class="btn small" id="addBurn">＋ Add burn</button></div>${x.burns.length?x.burns.map((b,i)=>`<div class="food"><div><div class="foodname">${esc(b.name)}</div><span class="muted">${fmt(b.cal)} kcal burned</span></div><div><button class="btn secondary small" onclick="burnForm(${i})">Edit</button></div></div>`).join(''):'<div class="empty">Add walking, gym or any other activity manually.</div>'}</section><section class="card"><div class="title">Today only</div><div class="grid2"><div class="field"><label>Maintenance kcal</label><input id="dayMaint" class="input" type="number" value="${t.maintenance}"></div><div class="field"><label>Morning weight kg</label><input id="dayWeight" class="input" type="number" step=".1" value="${x.weight??''}"></div></div><button class="btn" id="saveDay" style="width:100%">Save this day</button><p class="muted">Changing maintenance here affects only ${selected}. Previous days stay unchanged.</p></section>`}
function progress(){let s=S.settings,c=cumulativeDeficit(),def=Math.max(0,-c),theory=s.startWeight-def/s.calPerKg,loss=Math.max(0,s.startWeight-s.goalWeight),wp=loss?Math.max(0,Math.min(100,(s.startWeight-theory)/loss*100)):0,tp=s.targetDeficit?Math.min(100,def/s.targetDeficit*100):0;return `<section class="card hero"><div class="row"><div><span class="label">YOUR RESULT</span><div class="balance def">${fmt(def)}</div><div class="caption">CUMULATIVE CALORIE DEFICIT</div><p class="muted">${fmt(Math.max(0,s.targetDeficit-def))} kcal remaining to target</p></div><div class="ring" style="--p:${tp}%"><span><b>${tp.toFixed(0)}%</b><small>TARGET</small></span></div></div></section><section class="card"><div class="title">Weight transformation</div><div class="grid2"><div class="stat"><span class="label">Starting</span><b>${s.startWeight.toFixed(1)} kg</b></div><div class="stat"><span class="label">Goal</span><b>${s.goalWeight.toFixed(1)} kg</b></div><div class="stat"><span class="label">Theoretical now</span><b>${theory.toFixed(1)} kg</b></div><div class="stat"><span class="label">Average daily deficit</span><b>${fmt(Math.max(0,-avgBalance()))}</b></div></div><div style="margin-top:15px"><div class="row"><span class="muted">Progress to goal</span><b>${wp.toFixed(1)}%</b></div><div class="bar"><div class="fill green" style="width:${wp}%"></div></div></div></section><section class="card"><div class="title">Goal dashboard</div><div class="grid3"><div class="stat"><span class="label">Target</span><b>${fmt(s.targetDeficit)}</b></div><div class="stat"><span class="label">Tracked days</span><b>${tracked().length}</b></div><div class="stat"><span class="label">Calories / kg</span><b>${fmt(s.calPerKg)}</b></div></div></section><section class="card"><div class="title">Recent weigh-ins</div>${weightRows()}</section>`}
function weightRows(){let a=Object.keys(S.days).filter(d=>S.days[d].weight!=null).sort().slice(-8).reverse();return a.length?a.map(d=>`<div class="food"><span>${new Date(d+'T12:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}</span><b>${n(S.days[d].weight).toFixed(1)} kg</b></div>`).join(''):'<div class="empty">Log morning weight from the Daily screen.</div>'}
function calendar(){let q=new Date(selected+'T12:00'),y=q.getFullYear(),m=q.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),out=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="calhead">${x}</div>`).join('');for(let i=0;i<first;i++)out+='<div></div>';for(let i=1;i<=days;i++){let d=`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`,t=S.days[d]?totals(d):null;out+=`<button class="calday ${d===TOD()?'today ':''}${t&&t.has?(t.balance<0?'def':'sur'):''}" onclick="dayReport('${d}')"><strong>${i}</strong>${t&&t.has?`<span class="${t.balance<0?'pos':'neg'}">${t.balance<0?'−':'+'}${fmt(Math.abs(t.balance))}</span>`:''}</button>`}return `<section class="card"><div class="row"><button class="btn secondary small" onclick="month(-1)">‹</button><div class="title">${q.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</div><button class="btn secondary small" onclick="month(1)">›</button></div><div class="calendar">${out}</div><p class="muted">Green = deficit · Red = surplus · Tap any day.</p></section>`}
function charts(){return `<section class="card"><div class="row"><div class="title">Cumulative deficit</div><span class="muted">Target ${fmt(S.settings.targetDeficit)}</span></div><div class="chart"><canvas id="defChart"></canvas></div></section><section class="card"><div class="row"><div class="title">Theoretical weight</div><span class="muted">${S.settings.startWeight} → ${S.settings.goalWeight} kg</span></div><div class="chart"><canvas id="weightChart"></canvas></div></section>`}
function prediction(){let s=S.settings,def=Math.max(0,-cumulativeDeficit()),remain=Math.max(0,s.targetDeficit-def),avg=Math.max(0,-avgBalance()),days=avg?remain/avg:null,date=days?new Date(Date.now()+days*86400000):null;return `<section class="card hero"><span class="label">THE ROAD AHEAD</span><h2>Goal forecast</h2><div class="grid2"><div class="stat"><span class="label">Remaining deficit</span><b>${fmt(remain)} kcal</b></div><div class="stat"><span class="label">Daily average</span><b>${fmt(avg)} kcal</b></div><div class="stat"><span class="label">Estimated days</span><b>${days?Math.ceil(days):'—'}</b></div><div class="stat"><span class="label">Approx. date</span><b>${date?date.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'—'}</b></div></div></section><section class="card"><div class="title">Calculation</div><div class="food"><span>Target</span><b>${fmt(s.targetDeficit)} kcal</b></div><div class="food"><span>Accumulated</span><b>${fmt(def)} kcal</b></div><div class="food"><span>Remaining</span><b>${fmt(remain)} kcal</b></div>${avg?'<p class="muted">The forecast uses your tracked average daily deficit. Actual scale weight can vary because of water, glycogen and other factors.</p>':'<div class="empty">Log some food and deficit days to generate a forecast.</div>'}</section>`}
function settings(){let s=S.settings;return `<section class="card"><div class="title">Goal settings</div><div class="grid2"><div class="field"><label>Default maintenance kcal</label><input id="setMaint" class="input" type="number" value="${s.maintenance}"></div><div class="field"><label>Starting weight kg</label><input id="setStart" class="input" type="number" step=".1" value="${s.startWeight}"></div><div class="field"><label>Goal weight kg</label><input id="setGoal" class="input" type="number" step=".1" value="${s.goalWeight}"></div><div class="field"><label>Target deficit kcal</label><input id="setTarget" class="input" type="number" value="${s.targetDeficit}"></div><div class="field"><label>Calories per kg</label><input id="setKcal" class="input" type="number" value="${s.calPerKg}"></div></div><button class="btn" id="saveSettings" style="width:100%">Save settings</button><p class="muted">Default maintenance is copied only when a new day is created.</p></section><section class="card"><div class="title">Backup & restore</div><div class="grid2"><button class="btn" id="exportBtn">Export backup</button><label class="btn secondary" style="text-align:center">Import backup<input id="importFile" type="file" accept="application/json" hidden></label></div></section><section class="card"><div class="title">Privacy</div><p class="muted">Everything stays in this browser. No AI, account, database or external API.</p><button class="btn danger" id="clearBtn" style="width:100%">Clear all data</button></section>`}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});let d=document.getElementById('date');if(d)d.onchange=e=>{selected=e.target.value;render()};let a=document.getElementById('addFood');if(a)a.onclick=()=>foodForm(-1);let b=document.getElementById('addBurn');if(b)b.onclick=()=>burnForm(-1);let sd=document.getElementById('saveDay');if(sd)sd.onclick=()=>{let x=getDay();x.maintenance=n(dayMaint.value);if(dayWeight.value==='')delete x.weight;else x.weight=n(dayWeight.value);save();render()};let ss=document.getElementById('saveSettings');if(ss)ss.onclick=()=>{S.settings={maintenance:n(setMaint.value),startWeight:n(setStart.value),goalWeight:n(setGoal.value),targetDeficit:n(setTarget.value),calPerKg:n(setKcal.value)};save();render()};let ex=document.getElementById('exportBtn');if(ex)ex.onclick=exportData;let im=document.getElementById('importFile');if(im)im.onchange=importData;let cl=document.getElementById('clearBtn');if(cl)cl.onclick=()=>{if(confirm('Delete all tracker data?')){S=structuredClone(DEFAULT);save();render()}}}
function show(h){sheet.innerHTML=h;modal.classList.add('show')}function close(){modal.classList.remove('show')}modal.onclick=e=>{if(e.target===modal)close()}
function foodForm(i){let f=i<0?{name:'',qty:'',cal:'',p:'',c:'',fat:''}:getDay().foods[i];show(`<div class="row"><div><span class="label">FOOD LOG</span><h2>${i<0?'Add food':'Edit food'}</h2></div><button class="btn secondary small" onclick="close()">Close</button></div><div class="field"><label>Food name</label><input id="fn" class="input" value="${esc(f.name)}" placeholder="Chicken breast"></div><div class="field"><label>Quantity</label><input id="fq" class="input" value="${esc(f.qty)}" placeholder="150 g"></div><div class="grid2"><div class="field"><label>Calories</label><input id="fc" class="input" type="number" value="${f.cal}"></div><div class="field"><label>Protein g</label><input id="fp" class="input" type="number" step=".1" value="${f.p}"></div><div class="field"><label>Carbs g</label><input id="fcb" class="input" type="number" step=".1" value="${f.c}"></div><div class="field"><label>Fat g</label><input id="ff" class="input" type="number" step=".1" value="${f.fat}"></div></div><button class="btn" style="width:100%" onclick="saveFood(${i})">${i<0?'Add food':'Save changes'}</button>${i>=0?'<button class="btn danger" style="width:100%;margin-top:8px" onclick="deleteFood('+i+')">Delete food</button>':''}`)}
function saveFood(i){let f={name:fn.value||'Food',qty:fq.value,cal:n(fc.value),p:n(fp.value),c:n(fcb.value),fat:n(ff.value)};if(i<0)getDay().foods.push(f);else getDay().foods[i]=f;save();close();render()}function deleteFood(i){getDay().foods.splice(i,1);save();close();render()}
function burnForm(i){let b=i<0?{name:'',cal:''}:getDay().burns[i];show(`<div class="row"><div><span class="label">ACTIVITY</span><h2>${i<0?'Add burn':'Edit activity'}</h2></div><button class="btn secondary small" onclick="close()">Close</button></div><div class="field"><label>Activity</label><input id="bn" class="input" value="${esc(b.name)}" placeholder="Walking, gym"></div><div class="field"><label>Calories burned</label><input id="bc" class="input" type="number" value="${b.cal}"></div><button class="btn" style="width:100%" onclick="saveBurn(${i})">${i<0?'Add burn':'Save changes'}</button>${i>=0?'<button class="btn danger" style="width:100%;margin-top:8px" onclick="deleteBurn('+i+')">Delete activity</button>':''}`)}
function saveBurn(i){let b={name:bn.value||'Activity',cal:n(bc.value)};if(i<0)getDay().burns.push(b);else getDay().burns[i]=b;save();close();render()}function deleteBurn(i){getDay().burns.splice(i,1);save();close();render()}
function dayReport(d){let x=getDay(d),t=totals(d);show(`<div class="row"><div><span class="label">DAY REPORT</span><h2>${new Date(d+'T12:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}</h2><span class="muted">${d}</span></div><button class="btn secondary small" onclick="close()">Close</button></div><section class="card hero"><span class="label">BALANCE</span><div class="balance ${!t.has?'zero':t.balance<0?'def':'sur'}">${t.has?(t.balance<0?'−':'+')+fmt(Math.abs(t.balance)):'0'}</div><div class="caption">${!t.has?'No food logged':t.balance<0?'CALORIE DEFICIT':'CALORIE SURPLUS'}</div></section><div class="grid2"><div class="stat"><span class="label">Food</span><b>${fmt(t.cal)}</b></div><div class="stat"><span class="label">Maintenance</span><b>${fmt(t.maintenance)}</b></div><div class="stat"><span class="label">Extra burn</span><b>${fmt(t.burn)}</b></div><div class="stat"><span class="label">Protein</span><b>${fmt(t.p)}g</b></div></div><section class="card" style="margin-top:10px"><div class="title">Food</div>${x.foods.length?x.foods.map(f=>`<div class="food"><div><b>${esc(f.name)}</b><br><span class="muted">${esc(f.qty)} · ${fmt(f.cal)} kcal</span></div><span class="muted">P ${fmt(f.p)}g · C ${fmt(f.c)}g · F ${fmt(f.fat)}g</span></div>`).join(''):'<div class="empty">No food recorded.</div>'}</section>`)}
function month(v){let q=new Date(selected+'T12:00');q.setMonth(q.getMonth()+v);selected=`${q.getFullYear()}-${String(q.getMonth()+1).padStart(2,'0')}-01`;render()}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='calorie-tracker-backup-'+TOD()+'.json';a.click()}function importData(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.settings||!x.days)throw Error();S=x;save();render();alert('Backup restored.')}catch{alert('Invalid backup file.')}};r.readAsText(file)}
function drawCharts(){let ds=tracked(),def=[0],weights=[S.settings.startWeight],c=0;ds.forEach(d=>{c+=totals(d).balance;def.push(Math.max(0,-c));weights.push(S.settings.startWeight-Math.max(0,-c)/S.settings.calPerKg)});line(document.getElementById('defChart'),def,S.settings.targetDeficit);line(document.getElementById('weightChart'),weights,S.settings.goalWeight)}function line(c,a,target){if(!c)return;let W=c.clientWidth,H=c.clientHeight,d=devicePixelRatio||1;c.width=W*d;c.height=H*d;let x=c.getContext('2d');x.scale(d,d);let mn=Math.min(...a,target),mx=Math.max(...a,target);if(mn===mx){mn--;mx++}let X=i=>35+(W-48)*(i/(a.length-1||1)),Y=v=>18+(H-42)*(mx-v)/(mx-mn);x.strokeStyle='#e1e7f0';for(let i=0;i<5;i++){let y=18+i*(H-42)/4;x.beginPath();x.moveTo(35,y);x.lineTo(W-13,y);x.stroke()}x.strokeStyle='#3478ff';x.lineWidth=3;x.beginPath();a.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));x.stroke();x.fillStyle='#748198';x.font='11px system-ui';x.fillText(Math.round(mx).toLocaleString(),3,22);x.fillText(Math.round(mn).toLocaleString(),3,H-23);x.fillText('Goal '+Math.round(target).toLocaleString(),W-88,12)}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});render();
